<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Prueba QR | Después de la muerte
  </title>


  <style>

    body {

      margin: 0;

      padding: 20px;

      background: #111;

      color: #fff;

      font-family:
        Arial,
        sans-serif;

      text-align: center;

    }


    .contenedor {

      max-width: 500px;

      margin: 40px auto;

    }


    button {

      width: 100%;

      padding: 16px;

      margin-top: 20px;

      border: 0;

      border-radius: 10px;

      font-size: 17px;

      font-weight: bold;

      background: #fff;

      color: #111;

    }


    video {

      width: 100%;

      margin-top: 20px;

      border-radius: 15px;

      background: #000;

    }


    canvas {

      display: none;

    }


    #mensaje {

      margin-top: 20px;

      line-height: 1.5;

    }

  </style>

</head>


<body>


  <div class="contenedor">


    <h1>
      📷 Escáner QR
    </h1>


    <p>
      Prueba de cámara y lectura QR.
    </p>


    <button
      id="boton"
    >
      📷 Abrir cámara
    </button>


    <video
      id="video"
      autoplay
      playsinline
      muted
    ></video>


    <canvas
      id="canvas"
    ></canvas>


    <div
      id="mensaje"
    >
      Cámara todavía no iniciada.
    </div>


  </div>


  <script>


    const boton =
      document.getElementById(
        "boton"
      );


    const video =
      document.getElementById(
        "video"
      );


    const canvas =
      document.getElementById(
        "canvas"
      );


    const mensaje =
      document.getElementById(
        "mensaje"
      );


    let intervalo =
      null;


    let procesando =
      false;



    /*
     * =================================
     * CARGAR jsQR
     * =================================
     */


    function cargarJsQR() {

      return new Promise(
        function(resolve, reject) {


          if (
            window.jsQR
          ) {

            resolve();

            return;

          }


          const script =
            document.createElement(
              "script"
            );


          script.src =
            "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";


          script.onload =
            function() {

              resolve();

            };


          script.onerror =
            function() {

              reject(
                new Error(
                  "No se pudo cargar jsQR."
                )
              );

            };


          document
            .head
            .appendChild(
              script
            );

        }
      );

    }



    /*
     * =================================
     * ABRIR CÁMARA
     * =================================
     */


    boton.addEventListener(
      "click",
      async function() {


        boton.disabled =
          true;


        boton.textContent =
          "⏳ Abriendo cámara...";


        mensaje.textContent =
          "";


        try {


          /*
           * Primero cámara.
           */


          const stream =
            await navigator.mediaDevices
              .getUserMedia({

                video: {
                  facingMode: "environment"
                },

                audio: false

              });


          video.srcObject =
            stream;


          await video.play();


          boton.textContent =
            "✅ Cámara funcionando";


          mensaje.textContent =
            "Cámara activa. Cargando lector QR...";


          /*
           * Después jsQR.
           */


          await cargarJsQR();


          mensaje.textContent =
            "📷 Apunta la cámara a un código QR.";


          iniciarEscaneo();


        }


        catch(error) {


          boton.disabled =
            false;


          boton.textContent =
            "📷 Intentar de nuevo";


          mensaje.innerHTML =
            "❌ Error.<br><br>" +

            "<small>" +

            error.name +

            "<br>" +

            error.message +

            "</small>";


          console.error(
            error
          );

        }

      }
    );



    /*
     * =================================
     * ESCANEAR
     * =================================
     */


    function iniciarEscaneo() {


      const contexto =
        canvas.getContext(
          "2d",
          {
            willReadFrequently: true
          }
        );


      intervalo =
        setInterval(
          function() {


            if (
              procesando
            ) {

              return;

            }


            if (
              !video.videoWidth ||
              !video.videoHeight
            ) {

              return;

            }


            canvas.width =
              video.videoWidth;


            canvas.height =
              video.videoHeight;


            contexto.drawImage(
              video,
              0,
              0,
              canvas.width,
              canvas.height
            );


            const imagen =
              contexto.getImageData(
                0,
                0,
                canvas.width,
                canvas.height
              );


            const codigo =
              window.jsQR(
                imagen.data,
                imagen.width,
                imagen.height,
                {
                  inversionAttempts:
                    "dontInvert"
                }
              );


            if (
              codigo &&
              codigo.data
            ) {


              procesando =
                true;


              mensaje.innerHTML =
                "✅ QR detectado.<br><br>" +

                "<small>" +

                codigo.data +

                "</small>";


              clearInterval(
                intervalo
              );


            }


          },
          150
        );

    }


  </script>


</body>

</html>
