<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Control de acceso</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .contenedor {
      width: 100%;
      max-width: 500px;
      background: #1b1b1b;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 10px 35px rgba(0,0,0,.45);
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .subtitulo {
      color: #aaa;
      margin-bottom: 22px;
    }

    .sesion {
      font-size: 14px;
      color: #8cff9c;
      margin-bottom: 14px;
    }

    #video {
      width: 100%;
      max-height: 420px;
      object-fit: cover;
      border-radius: 14px;
      background: #000;
      display: none;
    }

    #canvas {
      display: none;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
    }

    #botonCamara {
      background: #fff;
      color: #111;
    }

    #botonOtro {
      background: #333;
      color: white;
      display: none;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .estado {
      margin-top: 18px;
      padding: 15px;
      border-radius: 12px;
      background: #242424;
      line-height: 1.5;
      word-break: break-word;
    }

    .valido {
      background: #123d20;
      color: #9affb1;
    }

    .usado {
      background: #432020;
      color: #ff9c9c;
    }

    .cancelado {
      background: #432020;
      color: #ff9c9c;
    }

    .cerrado {
      background: #403717;
      color: #ffe58a;
    }

    .error {
      background: #432020;
      color: #ff9c9c;
    }

  </style>

</head>

<body>

  <div class="contenedor">

    <h1>🎟️ Control de acceso</h1>

    <div class="subtitulo">
      Después de la muerte
    </div>

    <div
      id="sesion"
      class="sesion">
    </div>

    <video
      id="video"
      autoplay
      playsinline>
    </video>

    <canvas
      id="canvas">
    </canvas>

    <button
      id="botonCamara">
      📷 Abrir cámara
    </button>

    <button
      id="botonOtro">
      🔄 Escanear otro boleto
    </button>

    <div
      id="estado"
      class="estado">
      Pulsa "Abrir cámara" para comenzar.
    </div>

  </div>

  <script>

    /*
     * ==========================================
     * CONFIGURACIÓN
     * ==========================================
     */

    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycbyC7Z6SMYtjsQSHsCagLZLKQrSJ3ax_hlPHc-WUYuQy-7pt7CtC3s6ubrWqL9YEnQqjgg/exec";


    /*
     * ==========================================
     * TOKEN
     * ==========================================
     */

    const parametros =
      new URLSearchParams(
        window.location.search
      );

    const token =
      parametros.get("token") || "";


    /*
     * ==========================================
     * ELEMENTOS
     * ==========================================
     */

    const video =
      document.getElementById(
        "video"
      );

    const canvas =
      document.getElementById(
        "canvas"
      );

    const estado =
      document.getElementById(
        "estado"
      );

    const botonCamara =
      document.getElementById(
        "botonCamara"
      );

    const botonOtro =
      document.getElementById(
        "botonOtro"
      );

    const sesion =
      document.getElementById(
        "sesion"
      );


    /*
     * ==========================================
     * SESIÓN
     * ==========================================
     */

    if (token) {

      sesion.textContent =
        "✅ Sesión autorizada";

    } else {

      sesion.textContent =
        "❌ Sesión no autorizada";

      estado.textContent =
        "Regresa al inicio e ingresa nuevamente.";

      botonCamara.disabled =
        true;

    }


    /*
     * ==========================================
     * VARIABLES
     * ==========================================
     */

    let stream =
      null;

    let escaneando =
      false;

    let solicitudEnviada =
      false;

    let resultadoRecibido =
      false;


    /*
     * ==========================================
     * BOTÓN CÁMARA
     * ==========================================
     */

    botonCamara.onclick =
      async function() {

        if (!token) {

          return;

        }

        botonCamara.disabled =
          true;

        estado.className =
          "estado";

        estado.textContent =
          "📷 Activando cámara...";


        /*
         * IMPORTANTE:
         * LA CÁMARA SE SOLICITA
         * ANTES DE CARGAR jsQR.
         */

        try {

          if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
          ) {

            throw new Error(
              "Este navegador no permite acceder a la cámara desde esta página."
            );

          }

          stream =
            await navigator
              .mediaDevices
              .getUserMedia({

                video: {
                  facingMode: {
                    ideal: "environment"
                  }
                },

                audio: false

              });

        } catch (error) {

          console.error(
            "Error cámara:",
            error
          );

          estado.className =
            "estado error";

          estado.innerHTML =
            "❌ No se pudo abrir la cámara.<br><br>" +
            "<b>" +
            (error.name || "Error") +
            "</b><br>" +
            (error.message || "") +
            "<br><br>" +
            "Permite el acceso a la cámara para este sitio.";

          botonCamara.disabled =
            false;

          return;

        }


        /*
         * ======================================
         * CÁMARA ABIERTA
         * ======================================
         */

        video.srcObject =
          stream;

        video.style.display =
          "block";

        try {

          await video.play();

        } catch (error) {

          console.error(
            "Error reproduciendo cámara:",
            error
          );

        }


        estado.textContent =
          "📷 Cámara activa. Preparando lector QR...";


        /*
         * ======================================
         * CARGAR jsQR DESPUÉS DE LA CÁMARA
         * ======================================
         */

        try {

          await cargarJsQR();

        } catch (error) {

          detenerCamara();

          estado.className =
            "estado error";

          estado.textContent =
            "❌ No se pudo cargar el lector QR.";

          botonCamara.disabled =
            false;

          return;

        }


        /*
         * ======================================
         * INICIAR ESCANEO
         * ======================================
         */

        solicitudEnviada =
          false;

        resultadoRecibido =
          false;

        escaneando =
          true;

        botonCamara.style.display =
          "none";

        botonOtro.style.display =
          "none";

        estado.className =
          "estado";

        estado.textContent =
          "📷 Cámara activa. Apunta al código QR.";

        requestAnimationFrame(
          escanear
        );

      };


    /*
     * ==========================================
     * CARGAR jsQR
     * ==========================================
     */

    function cargarJsQR() {

      return new Promise(
        function(resolve, reject) {

          if (window.jsQR) {

            resolve();

            return;

          }

          const script =
            document.createElement(
              "script"
            );

          script.src =
            "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";

          script.onload =
            function() {

              if (
                typeof window.jsQR ===
                "function"
              ) {

                resolve();

              } else {

                reject(
                  new Error(
                    "jsQR no quedó disponible."
                  )
                );

              }

            };

          script.onerror =
            function() {

              reject(
                new Error(
                  "No se pudo cargar jsQR."
                )
              );

            };

          document
            .head
            .appendChild(
              script
            );

        }
      );

    }


    /*
     * ==========================================
     * ESCANEAR
     * ==========================================
     */

    function escanear() {

      if (!escaneando) {

        return;

      }

      if (
        video.readyState >= 2 &&
        video.videoWidth > 0 &&
        video.videoHeight > 0 &&
        typeof window.jsQR === "function"
      ) {

        canvas.width =
          video.videoWidth;

        canvas.height =
          video.videoHeight;

        const contexto =
          canvas.getContext(
            "2d",
            {
              willReadFrequently: true
            }
          );

        contexto.drawImage(
          video,
          0,
          0,
          canvas.width,
          canvas.height
        );

        const imagen =
          contexto.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
          );

        const resultadoQR =
          window.jsQR(
            imagen.data,
            imagen.width,
            imagen.height,
            {
              inversionAttempts:
                "attemptBoth"
            }
          );

        if (
          resultadoQR &&
          resultadoQR.data
        ) {

          procesarQR(
            resultadoQR.data
          );

          return;

        }

      }

      requestAnimationFrame(
        escanear
      );

    }


    /*
     * ==========================================
     * EXTRAER CÓDIGO
     * ==========================================
     */

    function extraerCodigo(
      contenido
    ) {

      const texto =
        String(
          contenido || ""
        ).trim();


      /*
       * DM-0001
       */

      const directo =
        texto.match(
          /DM-\d{4,}/i
        );

      if (directo) {

        return directo[0]
          .toUpperCase();

      }


      /*
       * URL CON ?code=
       */

      try {

        const url =
          new URL(
            texto
          );

        const code =
          url.searchParams.get(
            "code"
          );

        if (code) {

          const codigoURL =
            String(
              code
            ).match(
              /DM-\d{4,}/i
            );

          if (codigoURL) {

            return codigoURL[0]
              .toUpperCase();

          }

        }

      } catch (error) {

        /*
         * No era una URL.
         */

      }


      /*
       * ÚLTIMO INTENTO:
       * CUALQUIER DM-XXXX
       */

      const encontrado =
        texto.match(
          /DM-\d{4,}/i
        );

      if (encontrado) {

        return encontrado[0]
          .toUpperCase();

      }

      return "";

    }


    /*
     * ==========================================
     * PROCESAR QR
     * ==========================================
     */

    function procesarQR(
      contenido
    ) {

      if (
        solicitudEnviada
      ) {

        return;

      }

      const codigo =
        extraerCodigo(
          contenido
        );

      if (!codigo) {

        estado.className =
          "estado error";

        estado.textContent =
          "❌ El código QR no contiene un folio válido.";

        solicitudEnviada =
          false;

        requestAnimationFrame(
          escanear
        );

        return;

      }


      solicitudEnviada =
        true;

      escaneando =
        false;

      estado.className =
        "estado";

      estado.textContent =
        "🔎 Validando " +
        codigo +
        "...";


      enviarValidacion(
        codigo
      );

    }


    /*
     * ==========================================
     * ENVIAR VALIDACIÓN
     * ==========================================
     */

    function enviarValidacion(
      codigo
    ) {

      const url =
        URL_APPS_SCRIPT +
        "?modo=resultadoEscaneo" +
        "&code=" +
        encodeURIComponent(
          codigo
        ) +
        "&token=" +
        encodeURIComponent(
          token
        );


      const iframe =
        document.createElement(
          "iframe"
        );

      iframe.style.display =
        "none";

      iframe.src =
        url;

      document
        .body
        .appendChild(
          iframe
        );


      setTimeout(
        function() {

          if (
            !resultadoRecibido
          ) {

            estado.className =
              "estado error";

            estado.innerHTML =
              "⚠️ Error de comunicación<br><br>" +
              "Apps Script no respondió a tiempo.";

            botonOtro.style.display =
              "block";

            detenerCamara();

          }

        },
        12000
      );

    }


    /*
     * ==========================================
     * RECIBIR RESPUESTA
     * ==========================================
     */

    window.addEventListener(
      "message",
      function(event) {

        if (
          event.origin !==
            "https://script.google.com" &&
          event.origin !==
            "https://script.googleusercontent.com"
        ) {

          return;

        }

        const datos =
          event.data;

        if (
          !datos ||
          datos.tipo !==
            "RESULTADO_BOLETO"
        ) {

          return;

        }

        resultadoRecibido =
          true;

        mostrarResultado(
          datos.resultado
        );

      }
    );


    /*
     * ==========================================
     * MOSTRAR RESULTADO
     * ==========================================
     */

    function mostrarResultado(
      resultado
    ) {

      detenerCamara();

      botonOtro.style.display =
        "block";

      if (!resultado) {

        estado.className =
          "estado error";

        estado.textContent =
          "❌ No se recibió un resultado.";

        return;

      }

      const tipo =
        resultado.resultado ||
        resultado.estado ||
        "";

      const folio =
        resultado.folio ||
        resultado.codigo ||
        "";

      const nombre =
        resultado.nombre ||
        "No registrado";


      /*
       * VÁLIDO
       */

      if (
        tipo ===
        "VALIDO"
      ) {

        estado.className =
          "estado valido";

        estado.innerHTML =
          "🟢 <b>ENTRADA VÁLIDA</b><br><br>" +
          "Acceso autorizado<br><br>" +
          "Folio: <b>" +
          folio +
          "</b><br>" +
          "Nombre: <b>" +
          nombre +
          "</b>";

        return;

      }


      /*
       * USADO
       */

      if (
        tipo ===
        "USADO"
      ) {

        estado.className =
          "estado usado";

        estado.innerHTML =
          "🔴 <b>YA UTILIZADA</b><br><br>" +
          "Este boleto ya fue utilizado.<br><br>" +
          "Folio: <b>" +
          folio +
          "</b>";

        return;

      }


      /*
       * CANCELADO
       */

      if (
        tipo ===
        "CANCELADO"
      ) {

        estado.className =
          "estado cancelado";

        estado.innerHTML =
          "🚫 <b>ENTRADA CANCELADA</b><br><br>" +
          "Este boleto fue cancelado.<br><br>" +
          "Folio: <b>" +
          folio +
          "</b>";

        return;

      }


      /*
       * CERRADO / PENDIENTE
       */

      if (
        tipo === "CERRADA" ||
        tipo === "PENDIENTE"
      ) {

        estado.className =
          "estado cerrado";

        estado.innerHTML =
          "🟡 <b>ENTRADA AÚN NO ABIERTA</b><br><br>" +
          "El acceso todavía no está habilitado.";

        return;

      }


      /*
       * ERROR
       */

      estado.className =
        "estado error";

      estado.innerHTML =
        "❌ <b>No autorizado</b><br><br>" +
        (
          resultado.mensaje ||
          resultado.message ||
          "El boleto no pudo ser validado."
        );

    }


    /*
     * ==========================================
     * DETENER CÁMARA
     * ==========================================
     */

    function detenerCamara() {

      escaneando =
        false;

      if (stream) {

        stream
          .getTracks()
          .forEach(
            function(track) {

              track.stop();

            }
          );

        stream =
          null;

      }

      video.srcObject =
        null;

      video.style.display =
        "none";

    }


    /*
     * ==========================================
     * ESCANEAR OTRO
     * ==========================================
     */

    botonOtro.onclick =
      function() {

        resultadoRecibido =
          false;

        solicitudEnviada =
          false;

        estado.className =
          "estado";

        estado.textContent =
          "Pulsa 'Abrir cámara' para comenzar.";

        botonOtro.style.display =
          "none";

        botonCamara.style.display =
          "block";

        botonCamara.disabled =
          false;

      };

  </script>

</body>

</html>
