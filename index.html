<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Control de acceso | Después de la muerte
  </title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .contenedor {
      width: 100%;
      max-width: 420px;
      margin: 40px auto;
    }

    .titulo {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitulo {
      color: #aaa;
      margin-bottom: 25px;
    }

    .card {
      background: #1c1c1c;
      border-radius: 16px;
      padding: 22px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #ccc;
      font-size: 14px;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #111;
      color: #fff;
      font-size: 18px;
      outline: none;
    }

    input:focus {
      border-color: #fff;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #fff;
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    #mensaje {
      margin-top: 16px;
      text-align: center;
      color: #ff7777;
      min-height: 20px;
      line-height: 1.5;
    }

    #lectorQR {
      width: 100%;
      margin-top: 20px;
    }

    #resultadoEscaneo {
      margin-top: 16px;
      text-align: center;
      line-height: 1.5;
    }

  </style>

</head>


<body>

  <div class="contenedor">

    <div class="titulo">
      🔐 Control de acceso
    </div>

    <div class="subtitulo">
      Después de la muerte
    </div>


    <div class="card" id="contenido">

      <form
        id="formularioAcceso"
        method="POST"
        action="https://script.google.com/macros/s/AKfycbyC7Z6SMYtjsQSHsCagLZLKQrSJ3ax_hlPHc-WUYuQy-7pt7CtC3s6ubrWqL9YEnQqjgg/exec"
      >

        <label for="codigoAcceso">
          Código de acceso
        </label>

        <input
          id="codigoAcceso"
          name="codigo"
          type="password"
          autocomplete="off"
          placeholder="Ingresa el código"
          required
        >

        <button
          id="botonIngresar"
          type="submit"
        >
          🔐 Ingresar
        </button>

      </form>


      <div id="mensaje"></div>

    </div>

  </div>


  <script>

    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycbyC7Z6SMYtjsQSHsCagLZLKQrSJ3ax_hlPHc-WUYuQy-7pt7CtC3s6ubrWqL9YEnQqjgg/exec";


    const formulario =
      document.getElementById(
        "formularioAcceso"
      );


    const mensaje =
      document.getElementById(
        "mensaje"
      );


    /*
     * Si Apps Script nos devuelve
     * a esta página con #token=...
     * guardamos el token en la sesión.
     */

    function obtenerToken() {

      const hash =
        window.location.hash;


      if (
        !hash ||
        !hash.includes(
          "token="
        )
      ) {
        return null;
      }


      const parametros =
        new URLSearchParams(
          hash.substring(1)
        );


      return parametros.get(
        "token"
      );

    }


    const token =
      obtenerToken();


    if (token) {

      mostrarEscaner(
        token
      );

    }


    /*
     * Inicio de sesión.
     *
     * El formulario se manda
     * directamente a Apps Script.
     *
     * La contraseña nunca queda
     * escrita en este archivo.
     */

    formulario.addEventListener(
      "submit",
      function() {

        const boton =
          document.getElementById(
            "botonIngresar"
          );


        boton.disabled = true;

        boton.textContent =
          "⏳ Verificando...";

        mensaje.textContent =
          "";

      }
    );


    function cargarLectorQR() {

      return new Promise(
        function(resolve, reject) {

          if (
            typeof Html5Qrcode !==
            "undefined"
          ) {

            resolve();

            return;

          }


          const script =
            document.createElement(
              "script"
            );


          script.src =
            "https://unpkg.com/html5-qrcode";


          script.onload =
            resolve;


          script.onerror =
            reject;


          document.head.appendChild(
            script
          );

        }
      );

    }


    async function mostrarEscaner(
      token
    ) {

      const contenido =
        document.getElementById(
          "contenido"
        );


      contenido.innerHTML =

        "<div style='text-align:center;'>" +

          "<div style='font-size:24px;font-weight:bold;margin-bottom:8px;'>" +
            "📷 Escanear boleto" +
          "</div>" +

          "<div style='color:#aaa;font-size:14px;margin-bottom:20px;'>" +
            "Apunta la cámara al código QR del boleto." +
          "</div>" +

          "<button id='botonCamara' type='button'>" +
            "📷 Abrir cámara" +
          "</button>" +

          "<div id='lectorQR'></div>" +

          "<div id='resultadoEscaneo'></div>" +

        "</div>";


      document
        .getElementById(
          "botonCamara"
        )
        .addEventListener(
          "click",
          function() {

            iniciarCamara(
              token
            );

          }
        );

    }


    async function iniciarCamara(
  token
) {

  const boton =
    document.getElementById(
      "botonCamara"
    );

  const resultado =
    document.getElementById(
      "resultadoEscaneo"
    );

  boton.disabled = true;

  boton.textContent =
    "⏳ Preparando cámara...";

  try {

    await cargarLectorQR();

if (
  !navigator.mediaDevices ||
  !navigator.mediaDevices.getUserMedia
) {
  throw new Error(
    "Este navegador no permite acceder a la cámara desde esta página."
  );
}

const permisoCamara =
  await navigator.mediaDevices.getUserMedia({
    video: true
  });

permisoCamara
  .getTracks()
  .forEach(function(track) {
    track.stop();
  });

const lector =
  new Html5Qrcode(
    "lectorQR"
  );

await lector.start(

  {
    facingMode:
      {
        ideal: "environment"
      }
  },

  {
    fps: 10,

    qrbox: {
      width: 250,
      height: 250
    }

  },

  async function(
    textoQR
  ) {

    try {

      await lector.stop();

    } catch (error) {

      // La cámara ya puede haberse detenido.

    }

    procesarQR(
      textoQR,
      token
    );

  },

  function() {

    // Errores normales
    // mientras busca el QR.

  }

);

boton.textContent =
  "📷 Cámara activa";

  }

  catch(error) {

    resultado.innerHTML =
      "❌ No se pudo abrir la cámara.<br><br>" +
      "<small>" +
      (
        error.message ||
        error
      ) +
      "</small>";

    boton.disabled =
      false;

    boton.textContent =
      "📷 Intentar de nuevo";

  }

}

      const boton =
        document.getElementById(
          "botonCamara"
        );


      const resultado =
        document.getElementById(
          "resultadoEscaneo"
        );


      boton.disabled =
        true;


      boton.textContent =
        "⏳ Preparando cámara...";


      try {

        await cargarLectorQR();


        const lector =
          new Html5Qrcode(
            "lectorQR"
          );


        await lector.start(

          {
           facingMode:
  {
    ideal: "environment"
  }
          },

          {
            fps: 10,

            qrbox: {
              width: 250,
              height: 250
            }

          },


          async function(
            textoQR
          ) {

            await lector.stop();


            procesarQR(
              textoQR,
              token
            );

          },


          function() {

            // Errores normales
            // mientras busca QR.

          }

        );


        boton.textContent =
          "📷 Cámara activa";

      }

      catch(error) {

        resultado.innerHTML =
          "❌ No se pudo abrir la cámara.<br><br>" +
          "<small>" +
          (
            error.message ||
            error
          ) +
          "</small>";


        boton.disabled =
          false;


        boton.textContent =
          "📷 Intentar de nuevo";

      }

    }


    function procesarQR(
      textoQR,
      token
    ) {

      const resultado =
        document.getElementById(
          "resultadoEscaneo"
        );


      let codigo =
        "";


      try {

        const url =
          new URL(
            textoQR
          );


        codigo =
          url.searchParams.get(
            "code"
          );

      }

      catch(error) {

        resultado.innerHTML =
          "❌ QR no válido.";

        return;

      }


      if (!codigo) {

        resultado.innerHTML =
          "❌ No se encontró el código del boleto.";

        return;

      }


      if (!token) {

        resultado.innerHTML =
          "❌ Sesión no autorizada.";

        return;

      }


      resultado.innerHTML =
        "⏳ Verificando boleto...";


      /*
       * Enviamos código + token
       * a Apps Script.
       *
       * Apps Script decide si:
       *
       * DISPONIBLE → USADO
       * USADO → rechazar
       * CANCELADO → rechazar
       * sesión inválida → rechazar
       */

      const url =
        URL_APPS_SCRIPT +
        "?modo=resultadoEscaneo" +
        "&code=" +
        encodeURIComponent(
          codigo
        ) +
        "&token=" +
        encodeURIComponent(
          token
        );


      window.location.href =
        url;

    }

  </script>

</body>

</html>
