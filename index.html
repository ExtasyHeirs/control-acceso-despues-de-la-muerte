<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Control de acceso | Después de la muerte
  </title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .contenedor {
      width: 100%;
      max-width: 420px;
      margin: 60px auto;
    }

    .titulo {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitulo {
      color: #aaa;
      margin-bottom: 30px;
    }

    .card {
      background: #1c1c1c;
      border-radius: 16px;
      padding: 22px;
    }

    .estado {
      text-align: center;
      color: #aaa;
      line-height: 1.5;
    }

    .icono {
      font-size: 48px;
      margin-bottom: 12px;
    }

  </style>

</head>


<body>

  <div class="contenedor">

    <div class="titulo">
      🔐 Control de acceso
    </div>

    <div class="subtitulo">
      Después de la muerte
    </div>

    <div class="card">

      <div class="estado">

        <div class="icono">
          📷
        </div>

        <strong>
          Escáner de boletos
        </strong>

        <br><br>

        Estamos preparando el control
        de acceso.

      </div>

    </div>

  </div>

</body>

</html>
