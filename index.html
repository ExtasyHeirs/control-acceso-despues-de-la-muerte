<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Control de acceso | Después de la muerte
  </title>


  <style>

    body {

      margin: 0;

      padding: 20px;

      background: #111;

      color: #fff;

      font-family:
        Arial,
        sans-serif;

      text-align: center;

    }


    .contenedor {

      max-width: 500px;

      margin: 40px auto;

    }


    .tarjeta {

      background: #1c1c1c;

      border-radius: 18px;

      padding: 25px;

    }


    h1 {

      margin-top: 0;

    }


    p {

      color: #aaa;

      line-height: 1.5;

    }


    input {

      width: 100%;

      padding: 15px;

      margin-top: 15px;

      border: 0;

      border-radius: 10px;

      font-size: 17px;

      box-sizing: border-box;

    }


    button {

      width: 100%;

      padding: 16px;

      margin-top: 20px;

      border: 0;

      border-radius: 10px;

      font-size: 17px;

      font-weight: bold;

      background: #fff;

      color: #111;

    }


    button:disabled {

      opacity: 0.6;

    }


    .oculto {

      display: none;

    }


    video {

      width: 100%;

      margin-top: 20px;

      border-radius: 15px;

      background: #000;

    }


    canvas {

      display: none;

    }


    #mensajeLogin,

    #mensajeScanner {

      margin-top: 20px;

      line-height: 1.5;

    }

  </style>

</head>


<body>


  <div class="contenedor">


    <!-- ========================= -->
    <!-- LOGIN -->
    <!-- ========================= -->


    <div
      id="login"
      class="tarjeta"
    >

      <h1>
        🔐 Control de acceso
      </h1>


      <p>
        Ingresa el código de acceso
        proporcionado por la organización.
      </p>


      <form
        id="formularioLogin"
        method="POST"
        action="https://script.google.com/macros/s/AKfycbyC7Z6SMYtjsQSHsCagLZLKQrSJ3ax_hlPHc-WUYuQy-7pt7CtC3s6ubrWqL9YEnQqjgg/exec"
      >

        <input
          type="password"
          name="codigo"
          id="codigoAcceso"
          placeholder="Código de acceso"
          autocomplete="off"
          required
        >


        <button
          type="submit"
        >
          🔓 Entrar
        </button>

      </form>


      <div
        id="mensajeLogin"
      ></div>

    </div>



    <!-- ========================= -->
    <!-- ESCÁNER -->
    <!-- ========================= -->


    <div
      id="scanner"
      class="tarjeta oculto"
    >

      <h1>
        📷 Escáner QR
      </h1>


      <p>
        Apunta la cámara al código QR del boleto.
      </p>


      <button
        id="botonCamara"
        type="button"
      >
        📷 Abrir cámara
      </button>


      <video
        id="video"
        autoplay
        playsinline
        muted
      ></video>


      <canvas
        id="canvas"
      ></canvas>


      <div
        id="mensajeScanner"
      >
        Cámara todavía no iniciada.
      </div>

    </div>


  </div>



  <script>


    /*
     * ==================================
     * CONFIGURACIÓN
     * ==================================
     */


    let tokenAcceso =
      "";


    let intervalo =
      null;


    let procesando =
      false;



    /*
     * ==================================
     * OBTENER TOKEN
     * ==================================
     */


    function obtenerToken() {

      const hash =
        window.location.hash;


      if (!hash) {

        return "";

      }


      const parametros =
        new URLSearchParams(
          hash.substring(1)
        );


      return (
        parametros.get("token") ||
        ""
      );

    }



    /*
     * ==================================
     * MOSTRAR ESCÁNER
     * ==================================
     */


    function mostrarEscaner(
      token
    ) {

      tokenAcceso =
        token;


      document
        .getElementById("login")
        .classList
        .add("oculto");


      document
        .getElementById("scanner")
        .classList
        .remove("oculto");

    }



    /*
     * ==================================
     * CARGAR jsQR
     * ==================================
     */


    function cargarJsQR() {

      return new Promise(
        function(resolve, reject) {


          if (
            window.jsQR
          ) {

            resolve();

            return;

          }


          const script =
            document.createElement(
              "script"
            );


          script.src =
            "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";


          script.onload =
            function() {

              resolve();

            };


          script.onerror =
            function() {

              reject(
                new Error(
                  "No se pudo cargar jsQR."
                )
              );

            };


          document
            .head
            .appendChild(
              script
            );

        }
      );

    }



    /*
     * ==================================
     * ABRIR CÁMARA
     * ==================================
     */


    async function iniciarCamara() {


      const boton =
        document.getElementById(
          "botonCamara"
        );


      const video =
        document.getElementById(
          "video"
        );


      const mensaje =
        document.getElementById(
          "mensajeScanner"
        );


      boton.disabled =
        true;


      boton.textContent =
        "⏳ Abriendo cámara...";


      mensaje.textContent =
        "";


      try {


        /*
         * EXACTAMENTE LA PARTE
         * QUE YA COMPROBAMOS
         * QUE FUNCIONA.
         */


        const stream =
          await navigator.mediaDevices
            .getUserMedia({

              video: {
                facingMode: "environment"
              },

              audio: false

            });


        video.srcObject =
          stream;


        await video.play();


        boton.textContent =
          "✅ Cámara funcionando";


        mensaje.textContent =
          "Cámara activa. Cargando lector QR...";


        await cargarJsQR();


        mensaje.textContent =
          "📷 Apunta al código QR.";


        iniciarEscaneo();


      }


      catch(error) {


        boton.disabled =
          false;


        boton.textContent =
          "📷 Intentar de nuevo";


        mensaje.innerHTML =
          "❌ No se pudo abrir la cámara.<br><br>" +

          "<small>" +

          error.name +

          "<br>" +

          error.message +

          "</small>";


        console.error(
          "CAMARA:",
          error
        );

      }

    }



    /*
     * ==================================
     * ESCANEO QR
     * ==================================
     */


    function iniciarEscaneo() {


      const video =
        document.getElementById(
          "video"
        );


      const canvas =
        document.getElementById(
          "canvas"
        );


      const contexto =
        canvas.getContext(
          "2d",
          {
            willReadFrequently: true
          }
        );


      if (
        intervalo
      ) {

        clearInterval(
          intervalo
        );

      }


      intervalo =
        setInterval(
          function() {


            if (
              procesando
            ) {

              return;

            }


            if (
              !video.videoWidth ||
              !video.videoHeight
            ) {

              return;

            }


            canvas.width =
              video.videoWidth;


            canvas.height =
              video.videoHeight;


            contexto.drawImage(
              video,
              0,
              0,
              canvas.width,
              canvas.height
            );


            const imagen =
              contexto.getImageData(
                0,
                0,
                canvas.width,
                canvas.height
              );


            const codigo =
              window.jsQR(
                imagen.data,
                imagen.width,
                imagen.height,
                {
                  inversionAttempts:
                    "dontInvert"
                }
              );


            if (
              codigo &&
              codigo.data
            ) {


              procesando =
                true;


              clearInterval(
                intervalo
              );


              intervalo =
                null;


              mensajeQRDetectado(
                codigo.data
              );

            }


          },
          150
        );

    }



    /*
     * ==================================
     * QR DETECTADO
     * ==================================
     */


    function mensajeQRDetectado(
      datos
    ) {


      const mensaje =
        document.getElementById(
          "mensajeScanner"
        );


      mensaje.innerHTML =
        "✅ QR detectado.<br><br>" +

        "<small>" +

        datos +

        "</small>";


    }



    /*
     * ==================================
     * LOGIN
     * ==================================
     */


    document
      .getElementById(
        "formularioLogin"
      )
      .addEventListener(
        "submit",
        function() {


          document
            .getElementById(
              "mensajeLogin"
            )
            .textContent =
              "⏳ Verificando acceso...";


        }
      );



    /*
     * ==================================
     * BOTÓN CÁMARA
     * ==================================
     */


    document
      .getElementById(
        "botonCamara"
      )
      .addEventListener(
        "click",
        function() {

          iniciarCamara();

        }
      );



    /*
     * ==================================
     * ARRANQUE
     * ==================================
     */


    tokenAcceso =
      obtenerToken();


    if (
      tokenAcceso
    ) {

      mostrarEscaner(
        tokenAcceso
      );

    }


  </script>


</body>

</html>
