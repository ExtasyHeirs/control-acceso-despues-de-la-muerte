<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Control de acceso</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .contenedor {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .evento {
      color: #aaa;
      margin-bottom: 20px;
    }

    #video {
      width: 100%;
      max-width: 500px;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background: #000;
      border-radius: 18px;
      display: block;
      margin: 0 auto 15px;
    }

    .estado {
      background: #1c1c1c;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .estado.exito {
      border: 1px solid #35d878;
    }

    .estado.error {
      border: 1px solid #ff5555;
    }

    button {
      width: 100%;
      max-width: 500px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: white;
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
    }

    button:active {
      transform: scale(0.98);
    }

    .secundario {
      background: #292929;
      color: white;
    }

    .oculto {
      display: none !important;
    }

    #resultado {
      margin-top: 15px;
    }

  </style>

</head>

<body>

  <div class="contenedor">

    <h1>🎟️ Control de acceso</h1>

    <div class="evento">
      Después de la muerte
    </div>

    <video
      id="video"
      autoplay
      muted
      playsinline
    ></video>

    <div
      id="estado"
      class="estado"
    >
      📷 Preparando cámara...
    </div>

    <button
      id="btnCamara"
      type="button"
      onclick="cambiarCamara()"
      class="secundario"
    >
      🔄 Cambiar cámara
    </button>

    <button
      id="btnReintentar"
      type="button"
      onclick="iniciarCamara()"
      class="oculto"
    >
      📷 Activar cámara
    </button>

    <div id="resultado"></div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>


  <script>

    /*
     * CONFIGURACIÓN
     */

    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycbyC7Z6SMYtjsQSHsCagLZLKQrSJ3ax_hlPHc-WUYuQy-7pt7CtC3s6ubrWqL9YEnQqjgg/exec";


    /*
     * SESIÓN
     */

    const parametros =
      new URLSearchParams(
        window.location.search
      );

    const token =
      parametros.get("token");


    /*
     * ELEMENTOS
     */

    const video =
      document.getElementById("video");

    const estado =
      document.getElementById("estado");

    const btnCamara =
      document.getElementById("btnCamara");

    const btnReintentar =
      document.getElementById("btnReintentar");

    const resultadoDiv =
      document.getElementById("resultado");


    /*
     * VARIABLES
     */

    let streamActual = null;

    let camaraActual = "environment";

    let escaneando = false;

    let codigoProcesado = false;

    let validando = false;


    /*
     * VALIDAR SESIÓN
     */

    if (!token) {

      estado.innerHTML =
        "❌ Sesión no autorizada.";

      btnCamara.classList.add("oculto");

      video.classList.add("oculto");

    } else {

      iniciarCamara();

    }


    /*
     * INICIAR CÁMARA
     */

    async function iniciarCamara() {

      try {

        detenerCamara();

        escaneando = false;

        codigoProcesado = false;

        validando = false;

        resultadoDiv.innerHTML = "";

        video.classList.remove("oculto");

        btnCamara.classList.remove("oculto");

        btnReintentar.classList.add("oculto");

        estado.className = "estado";

        estado.innerHTML =
          "📷 Activando cámara...";


        const restricciones = {

          video: {

            facingMode: {
              ideal: camaraActual
            },

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }

          },

          audio: false

        };


        streamActual =
          await navigator.mediaDevices.getUserMedia(
            restricciones
          );


        video.srcObject =
          streamActual;


        await video.play();


        estado.innerHTML =
          "📷 Cámara activa.<br>" +
          "Apunta al código QR.";


        escaneando = true;

        escanear();


      } catch (error) {

        console.error(error);

        estado.className =
          "estado error";

        estado.innerHTML =
          "❌ No se pudo abrir la cámara." +
          "<br><br>" +
          "<small>" +
          error.name +
          "<br>" +
          error.message +
          "</small>";

        btnReintentar.classList.remove(
          "oculto"
        );

      }

    }


    /*
     * CAMBIAR CÁMARA
     */

    async function cambiarCamara() {

      if (
        camaraActual === "environment"
      ) {

        camaraActual = "user";

      } else {

        camaraActual = "environment";

      }

      estado.className =
        "estado";

      estado.innerHTML =
        "🔄 Cambiando cámara...";

      await iniciarCamara();

    }


    /*
     * DETENER CÁMARA
     */

    function detenerCamara() {

      escaneando = false;

      if (streamActual) {

        streamActual
          .getTracks()
          .forEach(
            track => track.stop()
          );

        streamActual = null;

      }

    }


    /*
     * ESCANEAR QR
     */

    function escanear() {

      if (
        !escaneando ||
        codigoProcesado ||
        validando
      ) {

        return;

      }


      if (
        video.readyState >= 2 &&
        video.videoWidth > 0 &&
        video.videoHeight > 0
      ) {

        const canvas =
          document.createElement("canvas");

        const contexto =
          canvas.getContext("2d");


        canvas.width =
          video.videoWidth;

        canvas.height =
          video.videoHeight;


        contexto.drawImage(
          video,
          0,
          0,
          canvas.width,
          canvas.height
        );


        const imagen =
          contexto.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
          );


        const codigoQR =
          jsQR(
            imagen.data,
            imagen.width,
            imagen.height,
            {
              inversionAttempts:
                "dontInvert"
            }
          );


        if (codigoQR) {

          procesarQR(
            codigoQR.data
          );

          return;

        }

      }


      requestAnimationFrame(
        escanear
      );

    }


    /*
     * PROCESAR QR
     */

    function procesarQR(datos) {

      if (
        codigoProcesado ||
        validando
      ) {

        return;

      }


      codigoProcesado = true;

      escaneando = false;


      detenerCamara();


      let codigo = "";


      /*
       * INTENTAR OBTENER CÓDIGO
       * DESDE URL
       */

      try {

        const url =
          new URL(datos);

        codigo =
          url.searchParams.get("code") ||
          url.searchParams.get("codigo") ||
          "";

      } catch (error) {

        codigo = "";

      }


      /*
       * SI NO ERA UNA URL,
       * BUSCAR FOLIO
       */

      if (!codigo) {

        const coincidencia =
          String(datos).match(
            /DM-\d{4,}/i
          );

        if (coincidencia) {

          codigo =
            coincidencia[0];

        } else {

          codigo =
            String(datos).trim();

        }

      }


      codigo =
        codigo.trim();


      estado.className =
        "estado";

      estado.innerHTML =
        "🎟️ Código QR leído correctamente.";


      validarBoleto(codigo);

    }


    /*
     * VALIDAR BOLETO
     */

    function validarBoleto(codigo) {

      validando = true;


      resultadoDiv.innerHTML =
        "<div class='estado'>" +
          "⏳ Validando boleto..." +
        "</div>";


      /*
       * EL LISTENER SE CREA
       * ANTES DE INSERTAR EL IFRAME.
       */

      let recibido = false;

      let tiempoInicio =
        Date.now();


      const iframe =
        document.createElement("iframe");


      iframe.style.display =
        "none";

      iframe.setAttribute(
        "aria-hidden",
        "true"
      );


      function recibirResultado(event) {

        if (
          !event.data ||
          event.data.tipo !==
          "RESULTADO_BOLETO"
        ) {

          return;

        }


        recibido = true;


        window.removeEventListener(
          "message",
          recibirResultado
        );


        const resultado =
          event.data.resultado;


        mostrarResultado(
          resultado
        );


        /*
         * Eliminamos el iframe
         * después de recibir respuesta.
         */

        setTimeout(
          function() {

            if (
              iframe &&
              iframe.parentNode
            ) {

              iframe.parentNode.removeChild(
                iframe
              );

            }

          },
          500
        );

      }


      window.addEventListener(
        "message",
        recibirResultado
      );


      /*
       * URL DE VALIDACIÓN
       */

      iframe.src =
        URL_APPS_SCRIPT +
        "?modo=resultadoEscaneo" +
        "&code=" +
        encodeURIComponent(codigo) +
        "&token=" +
        encodeURIComponent(token);


      document.body.appendChild(
        iframe
      );


      /*
       * TIEMPO MÁXIMO
       */

      setTimeout(
        function() {

          if (recibido) {

            return;

          }


          window.removeEventListener(
            "message",
            recibirResultado
          );


          if (
            iframe &&
            iframe.parentNode
          ) {

            iframe.parentNode.removeChild(
              iframe
            );

          }


          validando = false;


          resultadoDiv.innerHTML =
            "<div class='estado error'>" +
              "⚠️ Error de comunicación" +
              "<br><br>" +
              "Apps Script no respondió a tiempo." +
            "</div>" +

            "<button " +
              "type='button' " +
              "onclick='escanearOtroBoleto()'>" +
              "🔄 Escanear otro boleto" +
            "</button>";


        },
        15000
      );

    }


    /*
     * MOSTRAR RESULTADO
     */

    function mostrarResultado(resultado) {

      validando = false;


      if (!resultado) {

        resultadoDiv.innerHTML =
          "<div class='estado error'>" +
            "❌ No se recibió respuesta." +
          "</div>" +

          "<button " +
            "type='button' " +
            "onclick='escanearOtroBoleto()'>" +
            "🔄 Escanear otro boleto" +
          "</button>";

        return;

      }


      if (
        resultado.autorizado
      ) {

        resultadoDiv.innerHTML =
          "<div class='estado exito'>" +
            "✅ ENTRADA VÁLIDA" +
            "<br><br>" +
            "Acceso autorizado." +
            "<br><br>" +

            "<strong>" +
              "Folio: " +
              (
                resultado.folio ||
                "No registrado"
              ) +
            "</strong>" +

            "<br>" +

            "Nombre: " +
            (
              resultado.nombre ||
              "No registrado"
            ) +

          "</div>" +

          "<button " +
            "type='button' " +
            "onclick='escanearOtroBoleto()'>" +
            "🔄 Escanear otro boleto" +
          "</button>";

        return;

      }


      resultadoDiv.innerHTML =
        "<div class='estado error'>" +
          "❌ ENTRADA NO VÁLIDA" +
          "<br><br>" +
          (
            resultado.mensaje ||
            "Boleto no válido."
          ) +
        "</div>" +

        "<button " +
          "type='button' " +
          "onclick='escanearOtroBoleto()'>" +
          "🔄 Escanear otro boleto" +
        "</button>";

    }


    /*
     * ESCANEAR OTRO BOLETO
     */

    function escanearOtroBoleto() {

      resultadoDiv.innerHTML = "";

      codigoProcesado = false;

      validando = false;

      estado.className =
        "estado";

      estado.innerHTML =
        "📷 Preparando cámara...";


      iniciarCamara();

    }


  </script>

</body>
</html>
