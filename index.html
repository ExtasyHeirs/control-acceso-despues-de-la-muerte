<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#111111"
  >

  <title>
    Control de acceso | Después de la muerte
  </title>


  <style>

    body {

      margin: 0;
      padding: 20px;

      min-height: 100vh;

      box-sizing: border-box;

      background: #111;

      color: #fff;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      text-align: center;

    }


    .contenedor {

      width: 100%;

      max-width: 500px;

      margin:
        35px
        auto;

    }


    .tarjeta {

      background: #1c1c1c;

      border-radius: 18px;

      padding: 25px;

      box-sizing: border-box;

    }


    h1 {

      margin-top: 0;

      font-size: 28px;

    }


    p {

      color: #aaa;

      line-height: 1.5;

    }


    button {

      width: 100%;

      padding: 16px;

      margin-top: 20px;

      border: 0;

      border-radius: 12px;

      font-size: 17px;

      font-weight: bold;

      background: #fff;

      color: #111;

      cursor: pointer;

    }


    button:disabled {

      opacity: .5;

      cursor: wait;

    }


    video {

      width: 100%;

      margin-top: 20px;

      border-radius: 15px;

      background: #000;

      display: none;

    }


    canvas {

      display: none;

    }


    #mensaje {

      margin-top: 20px;

      line-height: 1.5;

      color: #aaa;

    }


    .estado {

      margin-top: 15px;

      padding: 12px;

      border-radius: 10px;

      background: #111;

      color: #aaa;

      line-height: 1.4;

    }


    .resultado {

      margin-top: 20px;

      padding: 18px;

      border-radius: 14px;

      background: #111;

      display: none;

    }


    .resultadoTitulo {

      font-size: 27px;

      font-weight: bold;

      margin-bottom: 12px;

    }


    .resultadoInfo {

      color: #ccc;

      line-height: 1.6;

    }


    .verde {

      color: #7CFF8A;

    }


    .rojo {

      color: #ff7777;

    }


    .amarillo {

      color: #ffd166;

    }


    .ayuda {

      margin-top: 18px;

      color: #777;

      font-size: 13px;

      line-height: 1.5;

    }


    #iframeResultado {

      display: none;

      width: 1px;

      height: 1px;

      border: 0;

    }

  </style>

</head>


<body>

  <div class="contenedor">

    <div class="tarjeta">

      <h1>
        🎟️ Control de acceso
      </h1>

      <p>
        Después de la muerte
      </p>


      <div
        id="estadoSesion"
        class="estado"
      >
        🔐 Verificando sesión...
      </div>


      <button
        id="botonCamara"
        type="button"
        disabled
      >
        📷 Abrir cámara
      </button>


      <video
        id="video"
        autoplay
        playsinline
        muted
      ></video>


      <canvas
        id="canvas"
      ></canvas>


      <div id="mensaje">
        Preparando escáner...
      </div>


      <div
        id="resultado"
        class="resultado"
      >

        <div
          id="resultadoTitulo"
          class="resultadoTitulo"
        ></div>


        <div
          id="resultadoInfo"
          class="resultadoInfo"
        ></div>


        <button
          id="botonOtro"
          type="button"
        >
          📷 Escanear otro boleto
        </button>

      </div>


      <div class="ayuda">

        📱 Este dispositivo funciona como
        escáner independiente.

        <br>

        Puedes utilizar varios celulares
        al mismo tiempo.

      </div>


      <iframe
        id="iframeResultado"
        title="Verificación"
      ></iframe>

    </div>

  </div>


  <script>

    /*
      =====================================================
      APPS SCRIPT
      =====================================================
    */

    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycbyC7Z6SMYtjsQSHsCagLZLKQrSJ3ax_hlPHc-WUYuQy-7pt7CtC3s6ubrWqL9YEnQqjgg/exec";


    /*
      =====================================================
      ELEMENTOS
      =====================================================
    */

    const video =
      document.getElementById(
        "video"
      );


    const canvas =
      document.getElementById(
        "canvas"
      );


    const contexto =
      canvas.getContext(
        "2d",
        {
          willReadFrequently:
            true
        }
      );


    const mensaje =
      document.getElementById(
        "mensaje"
      );


    const estadoSesion =
      document.getElementById(
        "estadoSesion"
      );


    const botonCamara =
      document.getElementById(
        "botonCamara"
      );


    const resultado =
      document.getElementById(
        "resultado"
      );


    const resultadoTitulo =
      document.getElementById(
        "resultadoTitulo"
      );


    const resultadoInfo =
      document.getElementById(
        "resultadoInfo"
      );


    const botonOtro =
      document.getElementById(
        "botonOtro"
      );


    const iframeResultado =
      document.getElementById(
        "iframeResultado"
      );


    /*
      =====================================================
      VARIABLES
      =====================================================
    */

    let token =
      "";


    let stream =
      null;


    let escaneando =
      false;


    let boletoEnProceso =
      false;


    let jsQRCargado =
      false;


    /*
      =====================================================
      OBTENER TOKEN
      =====================================================
    */

    function obtenerToken() {

      const parametros =
        new URLSearchParams(
          window.location.search
        );


      return (
        parametros.get(
          "token"
        ) ||
        ""
      );

    }


    /*
      =====================================================
      INICIO
      =====================================================
    */

    function iniciar() {

      token =
        obtenerToken();


      if (!token) {

        estadoSesion.style.color =
          "#ff7777";

        estadoSesion.textContent =
          "❌ Sesión no autorizada.";

        mensaje.textContent =
          "Regresa al inicio e ingresa nuevamente.";

        botonCamara.disabled =
          true;

        return;

      }


      estadoSesion.style.color =
        "#7CFF8A";

      estadoSesion.textContent =
        "✅ Sesión autorizada";


      botonCamara.disabled =
        false;


      mensaje.textContent =
        "Pulsa el botón para abrir la cámara.";

    }


    /*
      =====================================================
      BOTÓN CÁMARA
      =====================================================
    */

    botonCamara.addEventListener(
      "click",
      iniciarCamara
    );


    /*
      =====================================================
      BOTÓN OTRO BOLETO
      =====================================================
    */

    botonOtro.addEventListener(
      "click",
      function() {

        resultado.style.display =
          "none";


        resultadoTitulo.textContent =
          "";


        resultadoInfo.innerHTML =
          "";


        boletoEnProceso =
          false;


        iniciarEscaneo();

      }
    );


    /*
      =====================================================
      ABRIR CÁMARA
      =====================================================
    */

    async function iniciarCamara() {

      botonCamara.disabled =
        true;


      botonCamara.textContent =
        "⏳ Abriendo cámara...";


      mensaje.style.color =
        "#aaa";


      mensaje.textContent =
        "Solicitando acceso a la cámara...";


      try {

        /*
          Cada celular obtiene SU PROPIO stream.
        */

        if (!stream) {

          stream =
            await navigator
              .mediaDevices
              .getUserMedia({

                video: {

                  facingMode:
                    {
                      ideal:
                        "environment"
                    }

                },

                audio:
                  false

              });

        }


        video.srcObject =
          stream;


        video.style.display =
          "block";


        /*
          Esperamos a que el video
          tenga dimensiones reales.
        */

        await esperarVideo();


        botonCamara.textContent =
          "📷 Cámara activa";


        mensaje.style.color =
          "#fff";


        mensaje.textContent =
          "Apunta la cámara al código QR.";


        resultado.style.display =
          "none";


        cargarLectorQR();

      }

      catch(error) {

        botonCamara.disabled =
          false;


        botonCamara.textContent =
          "📷 Intentar de nuevo";


        mostrarErrorCamara(
          error
        );

      }

    }


    /*
      =====================================================
      ESPERAR VIDEO
      =====================================================
    */

    function esperarVideo() {

      return new Promise(
        function(resolve) {

          if (
            video.readyState >=
            2
          ) {

            resolve();

            return;

          }


          video.onloadedmetadata =
            function() {

              video.play()
                .then(
                  function() {

                    resolve();

                  }
                )
                .catch(
                  function() {

                    resolve();

                  }
                );

            };

        }
      );

    }


    /*
      =====================================================
      CARGAR JSQR
      =====================================================
    */

    function cargarLectorQR() {

      if (
        window.jsQR
      ) {

        iniciarEscaneo();

        return;

      }


      mensaje.style.color =
        "#aaa";


      mensaje.textContent =
        "🔄 Cargando lector QR...";


      const script =
        document.createElement(
          "script"
        );


      script.src =
        "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";


      script.onload =
        function() {

          jsQRCargado =
            true;

          iniciarEscaneo();

        };


      script.onerror =
        function() {

          escaneando =
            false;


          mensaje.style.color =
            "#ff7777";


          mensaje.textContent =
            "❌ No se pudo cargar el lector QR. Revisa la conexión a internet.";

          botonCamara.disabled =
            false;

          botonCamara.textContent =
            "📷 Intentar de nuevo";

        };


      document.head.appendChild(
        script
      );

    }


    /*
      =====================================================
      INICIAR ESCANEO
      =====================================================
    */

    function iniciarEscaneo() {

      if (
        !window.jsQR
      ) {

        return;

      }


      escaneando =
        true;


      boletoEnProceso =
        false;


      botonCamara.disabled =
        true;


      botonCamara.textContent =
        "📷 Cámara activa";


      mensaje.style.color =
        "#fff";


      mensaje.textContent =
        "Apunta la cámara al código QR.";


      requestAnimationFrame(
        escanear
      );

    }


    /*
      =====================================================
      ESCANEAR
      =====================================================
    */

    function escanear() {

      if (
        !escaneando
      ) {

        return;

      }


      if (
        video.readyState >=
        2
      ) {

        const ancho =
          video.videoWidth;


        const alto =
          video.videoHeight;


        if (
          ancho > 0 &&
          alto > 0
        ) {

          canvas.width =
            ancho;


          canvas.height =
            alto;


          contexto.drawImage(
            video,
            0,
            0,
            ancho,
            alto
          );


          const imagen =
            contexto.getImageData(
              0,
              0,
              ancho,
              alto
            );


          const codigoQR =
            window.jsQR(
              imagen.data,
              imagen.width,
              imagen.height
            );


          if (
            codigoQR &&
            codigoQR.data
          ) {

            procesarQR(
              codigoQR.data
            );

            return;

          }

        }

      }


      requestAnimationFrame(
        escanear
      );

    }


    /*
      =====================================================
      PROCESAR QR
      =====================================================
    */

    function procesarQR(
      textoQR
    ) {

      if (
        !escaneando ||
        boletoEnProceso
      ) {

        return;

      }


      boletoEnProceso =
        true;


      escaneando =
        false;


      mensaje.style.color =
        "#fff";


      mensaje.textContent =
        "🔎 Verificando boleto...";


      let codigo =
        String(
          textoQR ||
          ""
        )
          .trim();


      /*
        Si el QR contiene una URL,
        obtenemos ?code=
      */

      try {

        const url =
          new URL(
            textoQR
          );


        const codigoURL =
          url.searchParams.get(
            "code"
          );


        if (
          codigoURL
        ) {

          codigo =
            codigoURL;

        }

      }

      catch(error) {

        /*
          Si no es URL,
          usamos directamente
          el texto del QR.
        */

      }


      if (!codigo) {

        mostrarError(
          "❌ No se encontró un código válido."
        );

        return;

      }


      /*
        La cámara permanece en GitHub.

        Apps Script solamente procesa
        la validación dentro del iframe.
      */

      iframeResultado.src =

        URL_APPS_SCRIPT +

        "?modo=resultadoEscaneo" +

        "&code=" +

        encodeURIComponent(
          codigo
        ) +

        "&token=" +

        encodeURIComponent(
          token
        ) +

        "&t=" +

        Date.now();

    }


    /*
      =====================================================
      RECIBIR RESULTADO
      =====================================================
    */

    window.addEventListener(
      "message",
      function(event) {

        if (
          !event.origin
        ) {

          return;

        }


        const origenValido =

          event.origin.indexOf(
            "script.google.com"
          ) !== -1 ||

          event.origin.indexOf(
            "script.googleusercontent.com"
          ) !== -1;


        if (
          !origenValido
        ) {

          return;

        }


        if (
          !event.data ||
          event.data.tipo !==
            "RESULTADO_BOLETO"
        ) {

          return;

        }


        mostrarResultado(
          event.data.resultado
        );

      }
    );


    /*
      =====================================================
      MOSTRAR RESULTADO
      =====================================================
    */

    function mostrarResultado(
      datos
    ) {

      boletoEnProceso =
        false;


      if (!datos) {

        mostrarError(
          "❌ No se recibió respuesta del sistema."
        );

        return;

      }


      resultado.style.display =
        "block";


      /*
        ==============================================
        VÁLIDO
        ==============================================
      */

      if (
        datos.resultado ===
        "VALIDO"
      ) {

        resultadoTitulo.className =
          "resultadoTitulo verde";


        resultadoTitulo.textContent =
          "🟢 ENTRADA VÁLIDA";


        resultadoInfo.innerHTML =

          "<strong>" +

          "Acceso autorizado" +

          "</strong><br><br>" +

          "Folio: " +

          (
            datos.folio ||
            "Sin folio"
          ) +

          "<br>" +

          "Nombre: " +

          (
            datos.nombre ||
            "No registrado"
          ) +

          "<br><br>" +

          "Esta entrada acaba de ser registrada.";

      }


      /*
        ==============================================
        USADO
        ==============================================
      */

      else if (
        datos.resultado ===
        "USADO"
      ) {

        resultadoTitulo.className =
          "resultadoTitulo rojo";


        resultadoTitulo.textContent =
          "🔴 YA UTILIZADA";


        resultadoInfo.innerHTML =

          "<strong>" +

          "NO PERMITIR ACCESO" +

          "</strong><br><br>" +

          "Folio: " +

          (
            datos.folio ||
            "Sin folio"
          ) +

          "<br>" +

          "Nombre: " +

          (
            datos.nombre ||
            "No registrado"
          ) +

          "<br><br>" +

          "Esta entrada ya fue registrada anteriormente.";

      }


      /*
        ==============================================
        CANCELADO
        ==============================================
      */

      else if (
        datos.resultado ===
        "CANCELADO"
      ) {

        resultadoTitulo.className =
          "resultadoTitulo rojo";


        resultadoTitulo.textContent =
          "🚫 ENTRADA CANCELADA";


        resultadoInfo.innerHTML =

          datos.mensaje ||

          "Este boleto fue cancelado.";

      }


      /*
        ==============================================
        CERRADA
        ==============================================
      */

      else if (
        datos.resultado ===
        "CERRADA"
      ) {

        resultadoTitulo.className =
          "resultadoTitulo amarillo";


        resultadoTitulo.textContent =
          "🟡 ENTRADA AÚN NO ABIERTA";


        resultadoInfo.innerHTML =

          "Folio: " +

          (
            datos.folio ||
            "Sin folio"
          ) +

          "<br>" +

          "Nombre: " +

          (
            datos.nombre ||
            "No registrado"
          ) +

          "<br><br>" +

          (
            datos.mensaje ||
            "La entrada todavía no está abierta."
          );

      }


      /*
        ==============================================
        OTRO
        ==============================================
      */

      else {

        resultadoTitulo.className =
          "resultadoTitulo rojo";


        resultadoTitulo.textContent =
          "❌ ENTRADA NO VÁLIDA";


        resultadoInfo.innerHTML =

          datos.mensaje ||

          "Boleto no encontrado.";

      }


      mensaje.style.color =
        "#fff";


      mensaje.textContent =
        "Resultado de la verificación.";

    }


    /*
      =====================================================
      ERROR
      =====================================================
    */

    function mostrarError(
      texto
    ) {

      boletoEnProceso =
        false;


      escaneando =
        false;


      resultado.style.display =
        "block";


      resultadoTitulo.className =
        "resultadoTitulo rojo";


      resultadoTitulo.textContent =
        "⚠️ ERROR";


      resultadoInfo.textContent =
        texto;


      mensaje.style.color =
        "#ff7777";


      mensaje.textContent =
        "Puedes intentar nuevamente.";

    }


    /*
      =====================================================
      ERROR DE CÁMARA
      =====================================================
    */

    function mostrarErrorCamara(
      error
    ) {

      const nombre =
        String(
          error &&
          error.name
            ? error.name
            : ""
        )
          .toLowerCase();


      if (
        nombre ===
        "notallowederror"
      ) {

        mensaje.innerHTML =

          "❌ El navegador bloqueó la cámara.<br><br>" +

          "<small>" +

          "Permite la cámara para este sitio y vuelve a intentarlo." +

          "</small>";

      }


      else if (
        nombre ===
        "notfounderror"
      ) {

        mensaje.textContent =
          "❌ No se encontró una cámara disponible.";

      }


      else if (
        nombre ===
        "notreadableerror"
      ) {

        mensaje.textContent =
          "❌ La cámara está siendo utilizada por otra aplicación.";

      }


      else {

        mensaje.innerHTML =

          "❌ No se pudo abrir la cámara.<br><br>" +

          "<small>" +

          (
            error &&
            error.name
              ? error.name
              : "Error desconocido"
          ) +

          "<br>" +

          (
            error &&
            error.message
              ? error.message
              : ""
          ) +

          "</small>";

      }


      botonCamara.disabled =
        false;


      botonCamara.textContent =
        "📷 Intentar de nuevo";

    }


    /*
      =====================================================
      INICIAR
      =====================================================
    */

    iniciar();

  </script>

</body>

</html>
