<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Control de acceso | Después de la muerte
  </title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .contenedor {
      width: 100%;
      max-width: 420px;
      margin: 40px auto;
    }

    .titulo {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitulo {
      color: #aaa;
      margin-bottom: 25px;
    }

    .card {
      background: #1c1c1c;
      border-radius: 16px;
      padding: 22px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #ccc;
      font-size: 14px;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #111;
      color: #fff;
      font-size: 18px;
      outline: none;
    }

    input:focus {
      border-color: #fff;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #fff;
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    #mensaje {
      margin-top: 16px;
      text-align: center;
      color: #ff7777;
      min-height: 20px;
      line-height: 1.5;
    }

    #lectorQR {
      width: 100%;
      margin-top: 20px;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
    }

    #videoCamara {
      width: 100%;
      display: block;
      background: #000;
      border-radius: 12px;
    }

    #canvasQR {
      display: none;
    }

    #resultadoEscaneo {
      margin-top: 16px;
      text-align: center;
      line-height: 1.5;
    }

    .marcoQR {
      position: absolute;
      width: 250px;
      height: 250px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border: 3px solid #fff;
      border-radius: 12px;
      pointer-events: none;
    }

    .instruccionCamara {
      color: #aaa;
      font-size: 14px;
      text-align: center;
      margin-top: 12px;
      line-height: 1.5;
    }

  </style>

</head>

<body>

  <div class="contenedor">

    <div class="titulo">
      🔐 Control de acceso
    </div>

    <div class="subtitulo">
      Después de la muerte
    </div>

    <div class="card" id="contenido">

      <form
        id="formularioAcceso"
        method="POST"
        action="https://script.google.com/macros/s/AKfycbyC7Z6SMYtjsQSHsCagLZLKQrSJ3ax_hlPHc-WUYuQy-7pt7CtC3s6ubrWqL9YEnQqjgg/exec"
      >

        <label for="codigoAcceso">
          Código de acceso
        </label>

        <input
          id="codigoAcceso"
          name="codigo"
          type="password"
          autocomplete="off"
          placeholder="Ingresa el código"
          required
        >

        <button
          id="botonIngresar"
          type="submit"
        >
          🔐 Ingresar
        </button>

      </form>

      <div id="mensaje"></div>

    </div>

  </div>

  <script>

    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycbyC7Z6SMYtjsQSHsCagLZLKQrSJ3ax_hlPHc-WUYuQy-7pt7CtC3s6ubrWqL9YEnQqjgg/exec";


    const formulario =
      document.getElementById(
        "formularioAcceso"
      );


    const mensaje =
      document.getElementById(
        "mensaje"
      );


    let camaraActiva =
      null;


    let intervaloEscaneo =
      null;


    function obtenerToken() {

      const hash =
        window.location.hash;


      if (
        !hash ||
        !hash.includes(
          "token="
        )
      ) {

        return null;

      }


      const parametros =
        new URLSearchParams(
          hash.substring(1)
        );


      return parametros.get(
        "token"
      );

    }


    const token =
      obtenerToken();


    if (token) {

      mostrarEscaner(
        token
      );

    }


    formulario.addEventListener(
      "submit",
      function() {

        const boton =
          document.getElementById(
            "botonIngresar"
          );


        boton.disabled =
          true;


        boton.textContent =
          "⏳ Verificando...";


        mensaje.textContent =
          "";

      }
    );


    function cargarJsQR() {

      return new Promise(
        function(resolve, reject) {

          if (
            typeof jsQR !==
            "undefined"
          ) {

            resolve();

            return;

          }


          const script =
            document.createElement(
              "script"
            );


          script.src =
            "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";


          script.onload =
            resolve;


          script.onerror =
            function() {

              reject(
                new Error(
                  "No se pudo cargar el lector QR."
                )
              );

            };


          document.head.appendChild(
            script
          );

        }
      );

    }


    async function mostrarEscaner(
      token
    ) {

      const contenido =
        document.getElementById(
          "contenido"
        );


      contenido.innerHTML =

        "<div style='text-align:center;'>" +

          "<div style='font-size:24px;font-weight:bold;margin-bottom:8px;'>" +
            "📷 Escanear boleto" +
          "</div>" +

          "<div style='color:#aaa;font-size:14px;margin-bottom:20px;'>" +
            "Apunta la cámara al código QR del boleto." +
          "</div>" +

          "<button id='botonCamara' type='button'>" +
            "📷 Abrir cámara" +
          "</button>" +

          "<div id='lectorQR'></div>" +

          "<canvas id='canvasQR'></canvas>" +

          "<div id='resultadoEscaneo'></div>" +

        "</div>";


      document
        .getElementById(
          "botonCamara"
        )
        .addEventListener(
          "click",
          function() {

            iniciarCamara(
              token
            );

          }
        );

    }


    async function iniciarCamara(
      token
    ) {

      const boton =
        document.getElementById(
          "botonCamara"
        );


      const resultado =
        document.getElementById(
          "resultadoEscaneo"
        );


      boton.disabled =
        true;


      boton.textContent =
        "⏳ Abriendo cámara...";


      try {

        /*
         * Primero solicitamos directamente
         * el acceso a la cámara.
         *
         * Esto mantiene la llamada vinculada
         * al toque del usuario, algo importante
         * especialmente en Safari/iPad.
         */

        if (
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia
        ) {

          throw new Error(
            "Este navegador no permite acceder a la cámara."
          );

        }


        const stream =
          await navigator.mediaDevices
            .getUserMedia({

              video: {
                facingMode: "environment"
              },

              audio: false

            });


        camaraActiva =
          stream;


        const video =
          document.createElement(
            "video"
          );


        video.id =
          "videoCamara";


        video.setAttribute(
          "playsinline",
          ""
        );


        video.setAttribute(
          "autoplay",
          ""
        );


        video.muted =
          true;


        const lectorQR =
          document.getElementById(
            "lectorQR"
          );


        lectorQR.innerHTML =
          "";


        lectorQR.appendChild(
          video
        );


        const marco =
          document.createElement(
            "div"
          );


        marco.className =
          "marcoQR";


        lectorQR.appendChild(
          marco
        );


        const instruccion =
          document.createElement(
            "div"
          );


        instruccion.className =
          "instruccionCamara";


        instruccion.textContent =
          "Coloca el código dentro del cuadro.";


        lectorQR.appendChild(
          instruccion
        );


        video.srcObject =
          stream;


        await video.play();


        boton.textContent =
          "📷 Cámara activa";


        /*
         * La cámara ya abrió correctamente.
         * Ahora cargamos jsQR.
         */

        await cargarJsQR();


        const canvas =
          document.getElementById(
            "canvasQR"
          );


        const contexto =
          canvas.getContext(
            "2d",
            {
              willReadFrequently: true
            }
          );


        intervaloEscaneo =
          setInterval(
            function() {

              if (
                video.readyState <
                2
              ) {

                return;

              }


              const ancho =
                video.videoWidth;


              const alto =
                video.videoHeight;


              if (
                !ancho ||
                !alto
              ) {

                return;

              }


              canvas.width =
                ancho;


              canvas.height =
                alto;


              contexto.drawImage(
                video,
                0,
                0,
                ancho,
                alto
              );


              const imagen =
                contexto.getImageData(
                  0,
                  0,
                  ancho,
                  alto
                );


              const codigoQR =
                jsQR(
                  imagen.data,
                  imagen.width,
                  imagen.height
                );


              if (
                codigoQR &&
                codigoQR.data
              ) {

                detenerCamara();


                procesarQR(
                  codigoQR.data,
                  token
                );

              }

            },
            150
          );

      }

      catch(error) {

        detenerCamara();


        resultado.innerHTML =
          "❌ No se pudo abrir la cámara.<br><br>" +
          "<small>" +
          (
            error.message ||
            error
          ) +
          "</small>";


        boton.disabled =
          false;


        boton.textContent =
          "📷 Intentar de nuevo";

      }

    }


    function detenerCamara() {

      if (
        intervaloEscaneo
      ) {

        clearInterval(
          intervaloEscaneo
        );


        intervaloEscaneo =
          null;

      }


      if (
        camaraActiva
      ) {

        camaraActiva
          .getTracks()
          .forEach(
            function(track) {

              track.stop();

            }
          );


        camaraActiva =
          null;

      }

    }


    function procesarQR(
      textoQR,
      token
    ) {

      const resultado =
        document.getElementById(
          "resultadoEscaneo"
        );


      let codigo =
        "";


      try {

        const url =
          new URL(
            textoQR
          );


        codigo =
          url.searchParams.get(
            "code"
          );

      }

      catch(error) {

        resultado.innerHTML =
          "❌ QR no válido.";

        return;

      }


      if (!codigo) {

        resultado.innerHTML =
          "❌ No se encontró el código del boleto.";

        return;

      }


      if (!token) {

        resultado.innerHTML =
          "❌ Sesión no autorizada.";

        return;

      }


      resultado.innerHTML =
        "⏳ Verificando boleto...";


      const url =
        URL_APPS_SCRIPT +
        "?modo=resultadoEscaneo" +
        "&code=" +
        encodeURIComponent(
          codigo
        ) +
        "&token=" +
        encodeURIComponent(
          token
        );


      window.location.href =
        url;

    }

  </script>

</body>

</html>
