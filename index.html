<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Control de acceso | Después de la muerte
  </title>


  <style>

    body {

      margin: 0;

      padding: 20px;

      background: #111;

      color: #fff;

      font-family:
        Arial,
        sans-serif;

      text-align: center;

    }


    .contenedor {

      max-width: 500px;

      margin: 40px auto;

    }


    .tarjeta {

      background: #1c1c1c;

      border-radius: 18px;

      padding: 25px;

    }


    h1 {

      margin-top: 0;

      font-size: 28px;

    }


    p {

      color: #aaa;

      line-height: 1.5;

    }


    video {

      width: 100%;

      margin-top: 20px;

      border-radius: 15px;

      background: #000;

    }


    canvas {

      display: none;

    }


    #mensaje {

      margin-top: 20px;

      line-height: 1.5;

      color: #aaa;

    }


    .estado {

      margin-top: 15px;

      padding: 12px;

      border-radius: 10px;

      background: #111;

      color: #aaa;

    }

  </style>

</head>


<body>


  <div class="contenedor">


    <div class="tarjeta">


      <h1>
        🎟️ Control de acceso
      </h1>


      <p>
        Después de la muerte
      </p>


      <div
        id="estadoSesion"
        class="estado"
      >
        🔐 Verificando sesión...
      </div>


      <video
        id="video"
        autoplay
        playsinline
        muted
      ></video>


      <canvas
        id="canvas"
      ></canvas>


      <div
        id="mensaje"
      >
        Preparando cámara...
      </div>


    </div>


  </div>



  <script>


    /*
     * ==================================
     * CONFIGURACIÓN
     * ==================================
     */


    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycbyC7Z6SMYtjsQSHsCagLZLKQrSJ3ax_hlPHc-WUYuQy-7pt7CtC3s6ubrWqL9YEnQqjgg/exec";


    /*
     * ==================================
     * ELEMENTOS
     * ==================================
     */


    const video =
      document.getElementById(
        "video"
      );


    const canvas =
      document.getElementById(
        "canvas"
      );


    const mensaje =
      document.getElementById(
        "mensaje"
      );


    const estadoSesion =
      document.getElementById(
        "estadoSesion"
      );


    const contexto =
      canvas.getContext(
        "2d"
      );


    let token = "";

    let escaneando = false;

    let stream = null;



    /*
     * ==================================
     * OBTENER TOKEN
     * ==================================
     */


    function obtenerToken() {

      const parametros =
        new URLSearchParams(
          window.location.search
        );

      return (
        parametros.get("token") ||
        ""
      );

    }



    /*
     * ==================================
     * INICIAR
     * ==================================
     */


    async function iniciar() {

      token =
        obtenerToken();


      if (!token) {

        estadoSesion.style.color =
          "#ff7777";

        estadoSesion.textContent =
          "❌ Sesión no autorizada.";

        mensaje.textContent =
          "Regresa al inicio e ingresa nuevamente.";

        return;

      }


      estadoSesion.style.color =
        "#7CFF8A";

      estadoSesion.textContent =
        "✅ Sesión autorizada";


      try {

        const respuesta =
          await fetch(
            "https://unpkg.com/jsqr"
          );

      }

      catch(error) {

        console.error(
          error
        );

      }


      cargarLectorQR();

    }



    /*
     * ==================================
     * CARGAR JSQR
     * ==================================
     */


    function cargarLectorQR() {

      const script =
        document.createElement(
          "script"
        );


      script.src =
        "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";


      script.onload =
        function() {

          iniciarCamara();

        };


      script.onerror =
        function() {

          mensaje.style.color =
            "#ff7777";

          mensaje.textContent =
            "❌ No se pudo cargar el lector QR.";

        };


      document.head.appendChild(
        script
      );

    }



    /*
     * ==================================
     * CÁMARA
     * ==================================
     */


    async function iniciarCamara() {

      mensaje.textContent =
        "📷 Solicitando acceso a la cámara...";


      try {

        stream =
          await navigator.mediaDevices
            .getUserMedia({

              video: {

                facingMode:
                  "environment"

              },

              audio: false

            });


        video.srcObject =
          stream;


        escaneando =
          true;


        mensaje.style.color =
          "#fff";

        mensaje.textContent =
          "📷 Apunta la cámara al código QR.";


        requestAnimationFrame(
          escanear
        );

      }


      catch(error) {

        mensaje.style.color =
          "#ff7777";

        mensaje.innerHTML =
          "❌ No se pudo abrir la cámara.<br><br>" +
          "<small>" +
          error.name +
          "<br>" +
          error.message +
          "</small>";

        console.error(
          "CAMARA:",
          error
        );

      }

    }



    /*
     * ==================================
     * ESCANEAR QR
     * ==================================
     */


    function escanear() {

      if (
        !escaneando
      ) {

        return;

      }


      if (
        video.readyState ===
        video.HAVE_ENOUGH_DATA
      ) {

        canvas.width =
          video.videoWidth;

        canvas.height =
          video.videoHeight;


        contexto.drawImage(
          video,
          0,
          0,
          canvas.width,
          canvas.height
        );


        const imagen =
          contexto.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
          );


        const codigoQR =
          jsQR(
            imagen.data,
            imagen.width,
            imagen.height
          );


        if (
          codigoQR &&
          codigoQR.data
        ) {

          procesarQR(
            codigoQR.data
          );

          return;

        }

      }


      requestAnimationFrame(
        escanear
      );

    }



    /*
     * ==================================
     * PROCESAR QR
     * ==================================
     */


    function procesarQR(
      textoQR
    ) {

      if (
        !escaneando
      ) {

        return;

      }


      escaneando =
        false;


      if (
        stream
      ) {

        stream
          .getTracks()
          .forEach(
            function(track) {

              track.stop();

            }
          );

      }


      mensaje.style.color =
        "#fff";

      mensaje.textContent =
        "🔎 Verificando boleto...";


      let codigo =
        textoQR.trim();


      /*
       * El QR normalmente contiene
       * la URL de validación.
       *
       * Intentamos extraer
       * solamente el código.
       */


      try {

        const url =
          new URL(
            textoQR
          );


        const codigoURL =
          url.searchParams.get(
            "code"
          );


        if (
          codigoURL
        ) {

          codigo =
            codigoURL;

        }

      }

      catch(error) {

        /*
         * Si el QR no es una URL,
         * utilizamos directamente
         * el texto leído.
         */

      }


      if (
        !codigo
      ) {

        mensaje.style.color =
          "#ff7777";

        mensaje.textContent =
          "❌ No se encontró un código válido.";

        return;

      }


      /*
       * Enviamos el código y el token
       * al Apps Script.
       *
       * Apps Script realiza la validación
       * y el consumo del boleto.
       */


      const urlResultado =
        URL_APPS_SCRIPT +
        "?modo=resultadoEscaneo" +
        "&code=" +
        encodeURIComponent(
          codigo
        ) +
        "&token=" +
        encodeURIComponent(
          token
        );


      window.location.href =
        urlResultado;

    }



    /*
     * ==================================
     * ARRANQUE
     * ==================================
     */


    iniciar();


  </script>


</body>

</html>
