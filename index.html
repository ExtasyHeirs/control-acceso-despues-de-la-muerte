<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Control de acceso | Después de la muerte</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;
      padding: 20px;

      min-height: 100vh;

      background: #111;
      color: #fff;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

    }

    .contenedor {

      width: 100%;
      max-width: 430px;

      margin: 40px auto;

    }

    .tarjeta {

      background: #1c1c1c;

      border-radius: 18px;

      padding: 25px;

      text-align: center;

      box-shadow:
        0 10px 30px rgba(0,0,0,.35);

    }

    h1 {

      margin-top: 0;
      margin-bottom: 8px;

      font-size: 25px;

    }

    h2 {

      margin-top: 0;

    }

    p {

      color: #aaa;

      line-height: 1.5;

    }

    input {

      width: 100%;

      padding: 15px;

      margin-top: 12px;

      border: 0;

      border-radius: 10px;

      font-size: 17px;

      background: #2b2b2b;

      color: #fff;

      outline: none;

    }

    button {

      width: 100%;

      padding: 16px;

      margin-top: 15px;

      border: 0;

      border-radius: 10px;

      background: #fff;

      color: #111;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

    }

    button:disabled {

      opacity: .6;

      cursor: default;

    }

    .mensaje {

      margin-top: 18px;

      line-height: 1.5;

      color: #ccc;

      word-break: break-word;

    }

    .videoContenedor {

      position: relative;

      width: 100%;

      margin-top: 20px;

      overflow: hidden;

      border-radius: 15px;

      background: #000;

    }

    video {

      display: block;

      width: 100%;

      height: auto;

      background: #000;

    }

    .marcoQR {

      position: absolute;

      left: 15%;

      top: 20%;

      width: 70%;

      aspect-ratio: 1 / 1;

      border: 3px solid #fff;

      border-radius: 15px;

      pointer-events: none;

      box-shadow:
        0 0 0 9999px rgba(0,0,0,.15);

    }

    .oculto {

      display: none !important;

    }

    .estado {

      margin-top: 15px;

      padding: 12px;

      border-radius: 10px;

      background: #252525;

      color: #ddd;

      font-size: 14px;

    }

    .error {

      color: #ff7777;

    }

  </style>

</head>


<body>

  <div class="contenedor">

    <div
      class="tarjeta"
      id="tarjeta"
    >

      <h1>
        🔐 Control de acceso
      </h1>

      <p>
        Después de la muerte
      </p>


      <!-- LOGIN -->

      <div id="login">

        <p>
          Ingresa el código de acceso
          proporcionado por el administrador.
        </p>

        <form
          id="formularioLogin"
          method="POST"
          action="https://script.google.com/macros/s/AKfycbyC7Z6SMYtjsQSHsCagLZLKQrSJ3ax_hlPHc-WUYuQy-7pt7CtC3s6ubrWqL9YEnQqjgg/exec"
        >

          <input
            type="password"
            name="codigo"
            id="codigoAcceso"
            placeholder="Código de acceso"
            autocomplete="off"
            required
          >

          <button
            type="submit"
          >
            🔓 Entrar
          </button>

        </form>

        <div
          id="mensajeLogin"
          class="mensaje"
        ></div>

      </div>


      <!-- ESCÁNER -->

      <div
        id="scanner"
        class="oculto"
      >

        <h2>
          📷 Escáner
        </h2>

        <p>
          Apunta la cámara al código QR del boleto.
        </p>

        <button
          type="button"
          id="botonCamara"
        >
          📷 Abrir cámara
        </button>

        <div
          id="estadoScanner"
          class="estado"
        >
          Cámara apagada.
        </div>

        <div
          id="videoContenedor"
          class="videoContenedor"
        >

          <video
  id="video"
  autoplay
  playsinline
  muted
  style="
    display:block;
    width:100%;
    min-height:260px;
    background:#000;
    object-fit:cover;
  "
></video>

          <div
            class="marcoQR"
          ></div>

        </div>

        <canvas
          id="canvas"
          class="oculto"
        ></canvas>

        <div
          id="mensajeScanner"
          class="mensaje"
        ></div>

      </div>

    </div>

  </div>


  <script>

    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycbyC7Z6SMYtjsQSHsCagLZLKQrSJ3ax_hlPHc-WUYuQy-7pt7CtC3s6ubrWqL9YEnQqjgg/exec";


    let tokenAcceso = "";

    let streamCamara = null;

    let intervaloEscaneo = null;

    let procesandoQR = false;


    /*
     * =====================================================
     * LOGIN
     * =====================================================
     */

    document
      .getElementById("formularioLogin")
      .addEventListener(
        "submit",
        function() {

          document
            .getElementById("mensajeLogin")
            .textContent =
              "⏳ Verificando acceso...";

        }
      );


    /*
     * =====================================================
     * TOKEN
     * =====================================================
     */

    function obtenerToken() {

      const hash =
        window.location.hash;

      if (!hash) {
        return "";
      }

      const parametros =
        new URLSearchParams(
          hash.substring(1)
        );

      return (
        parametros.get("token") ||
        ""
      );

    }


    /*
     * =====================================================
     * MOSTRAR ESCÁNER
     * =====================================================
     */

    function mostrarEscaner() {

      tokenAcceso =
        obtenerToken();


      if (!tokenAcceso) {

        document
          .getElementById("login")
          .classList
          .remove("oculto");

        document
          .getElementById("scanner")
          .classList
          .add("oculto");

        return;

      }


      document
        .getElementById("login")
        .classList
        .add("oculto");

      document
        .getElementById("scanner")
        .classList
        .remove("oculto");

    }


    /*
     * =====================================================
     * ABRIR CÁMARA
     * =====================================================
     *
     * IMPORTANTE:
     *
     * Primero solicitamos la cámara con
     * video:true, igual que en la página
     * de prueba que sí funcionó.
     *
     * NO cargamos jsQR antes.
     *
     */

    document
      .getElementById("botonCamara")
      .addEventListener(
        "click",
        iniciarCamara
      );


    async function iniciarCamara() {

      const boton =
        document.getElementById(
          "botonCamara"
        );

      const estado =
        document.getElementById(
          "estadoScanner"
        );

      const mensaje =
        document.getElementById(
          "mensajeScanner"
        );

      const video =
        document.getElementById(
          "video"
        );

      const videoContenedor =
        document.getElementById(
          "videoContenedor"
        );


      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {

        mensaje.innerHTML =
          "<span class='error'>" +
          "❌ Este navegador no permite acceder a la cámara." +
          "</span>";

        return;

      }


      boton.disabled =
        true;

      boton.textContent =
        "⏳ Abriendo cámara...";

      estado.textContent =
        "Solicitando acceso a la cámara...";

      mensaje.textContent =
        "";


      /*
       * ===================================================
       * PRIMERA PRUEBA REAL DE CÁMARA
       * ===================================================
       */

      try {

        streamCamara =
          await navigator
            .mediaDevices
            .getUserMedia({

              video: true,

              audio: false

            });


      } catch(error) {

        boton.disabled =
          false;

        boton.textContent =
          "📷 Abrir cámara";

        estado.textContent =
          "La cámara no pudo abrirse.";

        mensaje.innerHTML =
          "<span class='error'>" +

          "❌ No se pudo abrir la cámara.<br><br>" +

          "<small>" +

          "Error: " +

          error.name +

          "<br>" +

          error.message +

          "</small>" +

          "</span>";

        console.error(
          "getUserMedia:",
          error
        );

        return;

      }


      /*
       * ===================================================
       * SI LLEGAMOS AQUÍ, LA CÁMARA ABRIÓ
       * ===================================================
       */

      video.srcObject =
        streamCamara;


      videoContenedor
        .classList
        .remove("oculto");


      boton.textContent =
        "✅ Cámara activa";


      estado.textContent =
        "📷 Cámara funcionando.";

      mensaje.textContent =
        "Preparando lector QR...";


      try {

        await video.play();

      } catch(error) {

        console.log(
          "video.play():",
          error
        );

      }


      /*
       * ===================================================
       * CARGAR jsQR DESPUÉS DE ABRIR CÁMARA
       * ===================================================
       */

      try {

        await cargarJsQR();

      } catch(error) {

        estado.textContent =
          "❌ Error cargando lector QR.";

        mensaje.innerHTML =
          "<span class='error'>" +

          error.message +

          "</span>";

        return;

      }


      estado.textContent =
        "📷 Cámara funcionando. Apunta al QR.";

      mensaje.textContent =
        "Buscando código QR...";


      iniciarEscaneoQR();

    }


    /*
     * =====================================================
     * CARGAR jsQR
     * =====================================================
     */

    function cargarJsQR() {

      return new Promise(
        function(resolve, reject) {

          if (
            typeof jsQR === "function"
          ) {

            resolve();

            return;

          }


          const script =
            document.createElement(
              "script"
            );


          script.src =
            "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";


          script.onload =
            function() {

              if (
                typeof jsQR === "function"
              ) {

                resolve();

              } else {

                reject(
                  new Error(
                    "jsQR no pudo cargarse."
                  )
                );

              }

            };


          script.onerror =
            function() {

              reject(
                new Error(
                  "No se pudo cargar el lector QR."
                )
              );

            };


          document
            .head
            .appendChild(
              script
            );

        }
      );

    }


    /*
     * =====================================================
     * ESCANEAR QR
     * =====================================================
     */

    function iniciarEscaneoQR() {

      const video =
        document.getElementById(
          "video"
        );

      const canvas =
        document.getElementById(
          "canvas"
        );


      if (intervaloEscaneo) {

        clearInterval(
          intervaloEscaneo
        );

      }


      intervaloEscaneo =
        setInterval(
          function() {

            if (
              procesandoQR
            ) {
              return;
            }


            if (
              video.readyState < 2
            ) {
              return;
            }


            const ancho =
              video.videoWidth;

            const alto =
              video.videoHeight;


            if (
              !ancho ||
              !alto
            ) {
              return;
            }


            canvas.width =
              ancho;

            canvas.height =
              alto;


            const contexto =
              canvas.getContext(
                "2d",
                {
                  willReadFrequently: true
                }
              );


            contexto.drawImage(
              video,
              0,
              0,
              ancho,
              alto
            );


            const imagen =
              contexto.getImageData(
                0,
                0,
                ancho,
                alto
              );


            const codigoQR =
              jsQR(
                imagen.data,
                imagen.width,
                imagen.height,
                {
                  inversionAttempts:
                    "dontInvert"
                }
              );


            if (
              codigoQR &&
              codigoQR.data
            ) {

              procesarQR(
                codigoQR.data
              );

            }

          },
          150
        );

    }


    /*
     * =====================================================
     * PROCESAR QR
     * =====================================================
     */

    function procesarQR(
      contenido
    ) {

      if (
        procesandoQR
      ) {
        return;
      }


      procesandoQR =
        true;


      if (
        intervaloEscaneo
      ) {

        clearInterval(
          intervaloEscaneo
        );

        intervaloEscaneo =
          null;

      }


      const mensaje =
        document.getElementById(
          "mensajeScanner"
        );


      mensaje.textContent =
        "⏳ Código detectado. Verificando boleto...";


      let codigo =
        "";


      try {

        const url =
          new URL(
            contenido
          );


        codigo =
          url.searchParams.get(
            "code"
          ) ||
          url.searchParams.get(
            "codigo"
          ) ||
          "";

      } catch(error) {

        codigo =
          String(
            contenido
          ).trim();

      }


      if (!codigo) {

        mensaje.innerHTML =
          "<span class='error'>" +

          "❌ El QR no contiene un código válido." +

          "</span>";

        procesandoQR =
          false;

        iniciarEscaneoQR();

        return;

      }


      const urlResultado =
        URL_APPS_SCRIPT +

        "?modo=resultadoEscaneo" +

        "&code=" +
        encodeURIComponent(
          codigo
        ) +

        "&token=" +
        encodeURIComponent(
          tokenAcceso
        );


      window.location.href =
        urlResultado;

    }


    /*
     * =====================================================
     * DETENER CÁMARA
     * =====================================================
     */

    function detenerCamara() {

      if (
        intervaloEscaneo
      ) {

        clearInterval(
          intervaloEscaneo
        );

        intervaloEscaneo =
          null;

      }


      if (
        streamCamara
      ) {

        streamCamara
          .getTracks()
          .forEach(
            function(track) {

              track.stop();

            }
          );

        streamCamara =
          null;

      }

    }


    /*
     * =====================================================
     * INICIO
     * =====================================================
     */

    mostrarEscaner();


    window.addEventListener(
      "pagehide",
      detenerCamara
    );

  </script>

</body>

</html>
