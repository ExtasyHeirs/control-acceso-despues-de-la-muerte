<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Prueba cámara | Después de la muerte
  </title>


  <style>

    body {

      margin: 0;

      padding: 20px;

      background: #111;

      color: #fff;

      font-family:
        Arial,
        sans-serif;

      text-align: center;

    }


    .contenedor {

      max-width: 500px;

      margin: 40px auto;

    }


    .tarjeta {

      background: #1c1c1c;

      border-radius: 18px;

      padding: 25px;

      margin-bottom: 20px;

    }


    h1 {

      margin-top: 0;

    }


    p {

      color: #aaa;

      line-height: 1.5;

    }


    input {

      width: 100%;

      padding: 15px;

      margin-top: 15px;

      border: 0;

      border-radius: 10px;

      font-size: 17px;

      box-sizing: border-box;

    }


    button {

      width: 100%;

      padding: 16px;

      margin-top: 20px;

      border: 0;

      border-radius: 10px;

      font-size: 17px;

      font-weight: bold;

      background: #fff;

      color: #111;

    }


    video {

      width: 100%;

      margin-top: 20px;

      border-radius: 15px;

      background: #000;

    }


    canvas {

      display: none;

    }


    #,

    #mensajeScanner {

      margin-top: 20px;

      line-height: 1.5;

    }

  </style>

</head>


<body>


  <div class="contenedor">


    <!-- ========================= -->
    <!-- LOGIN -->
    <!-- ========================= -->


    <div class="tarjeta">


      <h1>
        🔐 Control de acceso
      </h1>


      <p>
        Ingresa el código de acceso.
      </p>


      <form
        id="formularioLogin"
        method="POST"
        action="https://script.google.com/macros/s/AKfycbyC7Z6SMYtjsQSHsCagLZLKQrSJ3ax_hlPHc-WUYuQy-7pt7CtC3s6ubrWqL9YEnQqjgg/exec"
      >


        <input
          type="password"
          name="codigo"
          id="codigoAcceso"
          placeholder="Código de acceso"
          autocomplete="off"
          required
        >


        <button
          type="submit"
        >
          🔓 Entrar
        </button>


      </form>


      <div
        id="mensajeLogin"
      ></div>
<button
  id="botonSimular"
  type="button"
>
  🔓 Simular acceso
</button>

    </div>



    <!-- ========================= -->
    <!-- CÁMARA -->
    <!-- ========================= -->


    <div class="tarjeta">


      <h1>
        📷 Prueba de cámara
      </h1>


      <p>
        Esta cámara está visible desde que carga la página.
      </p>


      <button
        id="boton"
        type="button"
      >
        📷 Abrir cámara
      </button>


      <video
        id="video"
        autoplay
        playsinline
        muted
      ></video>


      <canvas
        id="canvas"
      ></canvas>


      <div
        id="mensajeScanner"
      >
        Cámara todavía no iniciada.
      </div>


    </div>


  </div>



  <script>


    /*
     * ==================================
     * LOGIN
     * ==================================
     */


    document
      .getElementById(
        "formularioLogin"
      )
      .addEventListener(
        "submit",
        function() {
document
  .getElementById(
    "botonSimular"
  )
  .addEventListener(
    "click",
    function() {

      document
        .getElementById(
          "mensajeLogin"
        )
        .textContent =
          "✅ Acceso autorizado.";

    }
  );

          document
            .getElementById(
              "mensajeLogin"
            )
            .textContent =
              "⏳ Verificando acceso...";


        }
      );



    /*
     * ==================================
     * CÁMARA
     * ==================================
     */


    const boton =
      document.getElementById(
        "boton"
      );


    const video =
      document.getElementById(
        "video"
      );


    const mensaje =
      document.getElementById(
        "mensajeScanner"
      );


    boton.addEventListener(
      "click",
      async function() {


        boton.disabled =
          true;


        boton.textContent =
          "⏳ Abriendo cámara...";


        mensaje.textContent =
          "";


        try {


          const stream =
            await navigator.mediaDevices
              .getUserMedia({

                video: {
                  facingMode: "environment"
                },

                audio: false

              });


          video.srcObject =
            stream;


          boton.textContent =
            "✅ Cámara funcionando";


          mensaje.textContent =
            "La cámara funciona correctamente.";


        }


        catch(error) {


          boton.disabled =
            false;


          boton.textContent =
            "📷 Intentar de nuevo";


          mensaje.innerHTML =
            "❌ No se pudo abrir la cámara.<br><br>" +

            "<small>" +

            error.name +

            "<br>" +

            error.message +

            "</small>";


          console.error(
            "CAMARA:",
            error
          );


        }

      }
    );


  </script>


</body>

</html>
