<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Control de acceso | Después de la muerte
  </title>

  <style>

    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .contenedor {
      max-width: 500px;
      margin: 40px auto;
    }

    .tarjeta {
      background: #1c1c1c;
      border-radius: 18px;
      padding: 25px;
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    p {
      color: #aaa;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      border: 0;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      background: #fff;
      color: #111;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    video {
      width: 100%;
      margin-top: 20px;
      border-radius: 15px;
      background: #000;
      display: none;
    }

    canvas {
      display: none;
    }

    #mensaje {
      margin-top: 20px;
      line-height: 1.5;
      color: #aaa;
    }

    .estado {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #111;
      color: #aaa;
    }

    .resultado {
      margin-top: 20px;
      padding: 18px;
      border-radius: 14px;
      background: #111;
      display: none;
    }

    .resultadoTitulo {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .resultadoInfo {
      color: #ccc;
      line-height: 1.6;
    }

    .verde {
      color: #7CFF8A;
    }

    .rojo {
      color: #ff7777;
    }

    .amarillo {
      color: #ffd166;
    }

  </style>

</head>

<body>

  <div class="contenedor">

    <div class="tarjeta">

      <h1>
        🎟️ Control de acceso
      </h1>

      <p>
        Después de la muerte
      </p>

      <div
        id="estadoSesion"
        class="estado"
      >
        🔐 Verificando sesión...
      </div>

      <button
        id="botonCamara"
        type="button"
        disabled
      >
        📷 Abrir cámara
      </button>

      <video
        id="video"
        autoplay
        playsinline
        muted
      ></video>

      <canvas
        id="canvas"
      ></canvas>

      <div
        id="mensaje"
      >
        Preparando escáner...
      </div>

      <div
        id="resultado"
        class="resultado"
      >

        <div
          id="resultadoTitulo"
          class="resultadoTitulo"
        ></div>

        <div
          id="resultadoInfo"
          class="resultadoInfo"
        ></div>

        <button
          id="botonOtro"
          type="button"
        >
          📷 Escanear otro boleto
        </button>

      </div>

    </div>

  </div>


  <script>

    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycbyC7Z6SMYtjsQSHsCagLZLKQrSJ3ax_hlPHc-WUYuQy-7pt7CtC3s6ubrWqL9YEnQqjgg/exec";


    const video =
      document.getElementById(
        "video"
      );


    const canvas =
      document.getElementById(
        "canvas"
      );


    const mensaje =
      document.getElementById(
        "mensaje"
      );


    const estadoSesion =
      document.getElementById(
        "estadoSesion"
      );


    const botonCamara =
      document.getElementById(
        "botonCamara"
      );


    const resultado =
      document.getElementById(
        "resultado"
      );


    const resultadoTitulo =
      document.getElementById(
        "resultadoTitulo"
      );


    const resultadoInfo =
      document.getElementById(
        "resultadoInfo"
      );


    const botonOtro =
      document.getElementById(
        "botonOtro"
      );


    const contexto =
      canvas.getContext(
        "2d"
      );


    let token = "";

    let stream = null;

    let escaneando = false;

    let boletoEnProceso = false;


    function obtenerToken() {

      const parametros =
        new URLSearchParams(
          window.location.search
        );

      return (
        parametros.get("token") ||
        ""
      );

    }


    function iniciar() {

      token =
        obtenerToken();


      if (!token) {

        estadoSesion.style.color =
          "#ff7777";

        estadoSesion.textContent =
          "❌ Sesión no autorizada.";

        mensaje.textContent =
          "Regresa al inicio e ingresa nuevamente.";

        return;

      }


      estadoSesion.style.color =
        "#7CFF8A";

      estadoSesion.textContent =
        "✅ Sesión autorizada";


      botonCamara.disabled =
        false;


      mensaje.textContent =
        "Pulsa el botón para abrir la cámara.";

    }


    botonCamara.addEventListener(
      "click",
      iniciarCamara
    );


    botonOtro.addEventListener(
      "click",
      function() {

        resultado.style.display =
          "none";

        mensaje.style.color =
          "#aaa";

        mensaje.textContent =
          "Listo para escanear otro boleto.";

        botonCamara.disabled =
          false;

        botonCamara.textContent =
          "📷 Abrir cámara";

      }
    );


    async function iniciarCamara() {

      botonCamara.disabled =
        true;


      botonCamara.textContent =
        "⏳ Abriendo cámara...";


      mensaje.style.color =
        "#aaa";


      mensaje.textContent =
        "Solicitando acceso a la cámara...";


      try {

        detenerCamara();


        stream =
          await navigator.mediaDevices
            .getUserMedia({

              video: {
                facingMode:
                  "environment"
              },

              audio: false

            });


        video.srcObject =
          stream;


        video.style.display =
          "block";


        escaneando =
          true;


        boletoEnProceso =
          false;


        botonCamara.textContent =
          "📷 Cámara activa";


        mensaje.style.color =
          "#fff";


        mensaje.textContent =
          "Apunta la cámara al código QR.";


        resultado.style.display =
          "none";


        cargarLectorQR();

      }

      catch(error) {

        botonCamara.disabled =
          false;


        botonCamara.textContent =
          "📷 Intentar de nuevo";


        mensaje.style.color =
          "#ff7777";


        mensaje.innerHTML =
          "❌ No se pudo abrir la cámara.<br><br>" +
          "<small>" +
          error.name +
          "<br>" +
          error.message +
          "</small>";


        console.error(
          "CAMARA:",
          error
        );

      }

    }


    function detenerCamara() {

      escaneando =
        false;


      if (
        stream
      ) {

        stream
          .getTracks()
          .forEach(
            function(track) {

              try {

                track.stop();

              }

              catch(error) {

                console.error(
                  "ERROR AL DETENER TRACK:",
                  error
                );

              }

            }
          );

      }


      stream =
        null;


      video.srcObject =
        null;


      video.style.display =
        "none";

    }


    function cargarLectorQR() {

      if (
        window.jsQR
      ) {

        requestAnimationFrame(
          escanear
        );

        return;

      }


      const script =
        document.createElement(
          "script"
        );


      script.src =
        "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";


      script.onload =
        function() {

          requestAnimationFrame(
            escanear
          );

        };


      script.onerror =
        function() {

          escaneando =
            false;


          detenerCamara();


          mensaje.style.color =
            "#ff7777";


          mensaje.textContent =
            "❌ No se pudo cargar el lector QR.";

        };


      document.head.appendChild(
        script
      );

    }


    function escanear() {

      if (
        !escaneando
      ) {

        return;

      }


      if (
        video.readyState ===
        video.HAVE_ENOUGH_DATA
      ) {

        canvas.width =
          video.videoWidth;


        canvas.height =
          video.videoHeight;


        contexto.drawImage(
          video,
          0,
          0,
          canvas.width,
          canvas.height
        );


        const imagen =
          contexto.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
          );


        const codigoQR =
          jsQR(
            imagen.data,
            imagen.width,
            imagen.height
          );


        if (
          codigoQR &&
          codigoQR.data
        ) {

          procesarQR(
            codigoQR.data
          );

          return;

        }

      }


      requestAnimationFrame(
        escanear
      );

    }


    function procesarQR(
      textoQR
    ) {

      if (
        !escaneando ||
        boletoEnProceso
      ) {

        return;

      }


      boletoEnProceso =
        true;


      escaneando =
        false;


      detenerCamara();


      mensaje.style.color =
        "#fff";


      mensaje.textContent =
        "🔎 Verificando boleto...";


      let codigo =
        textoQR.trim();


      try {

        const url =
          new URL(
            textoQR
          );


        const codigoURL =
          url.searchParams.get(
            "code"
          );


        if (
          codigoURL
        ) {

          codigo =
            codigoURL;

        }

      }

      catch(error) {

        /*
         * Si no es una URL,
         * usamos directamente
         * el texto del QR.
         */

      }


      if (!codigo) {

        mostrarError(
          "❌ No se encontró un código válido."
        );

        return;

      }


      /*
       * IMPORTANTE:
       *
       * Ya no navegamos a Apps Script.
       *
       * El resultado llegará a esta
       * misma página mediante comunicación
       * entre ventanas.
       */

      const ventana =
        window.open(
          URL_APPS_SCRIPT +
          "?modo=resultadoEscaneo" +
          "&code=" +
          encodeURIComponent(
            codigo
          ) +
          "&token=" +
          encodeURIComponent(
            token
          ),
          "resultadoBoleto"
        );


      if (!ventana) {

        mostrarError(
          "❌ El navegador bloqueó la ventana de verificación."
        );

        boletoEnProceso =
          false;

      }

    }


    window.addEventListener(
      "message",
      function(event) {

        /*
         * Solo aceptamos mensajes
         * provenientes de Apps Script.
         */

        if (
          !event.origin ||
          event.origin.indexOf(
            "script.google.com"
          ) === -1
        ) {

          return;

        }


        if (
          !event.data ||
          event.data.tipo !==
          "RESULTADO_BOLETO"
        ) {

          return;

        }


        mostrarResultado(
          event.data.resultado
        );

      }
    );


    function mostrarResultado(
      datos
    ) {

      boletoEnProceso =
        false;


      if (!datos) {

        mostrarError(
          "❌ No se recibió respuesta del sistema."
        );

        return;

      }


      resultado.style.display =
        "block";


      if (
        datos.resultado ===
        "VALIDO"
      ) {

        resultadoTitulo.className =
          "resultadoTitulo verde";

        resultadoTitulo.textContent =
          "🟢 ENTRADA VÁLIDA";


        resultadoInfo.innerHTML =
          "<strong>Acceso autorizado</strong><br><br>" +
          "Folio: " +
          (datos.folio || "Sin folio") +
          "<br>" +
          "Nombre: " +
          (datos.nombre || "No registrado") +
          "<br><br>" +
          "Esta entrada acaba de ser registrada.";

      }

      else if (
        datos.resultado ===
        "USADO"
      ) {

        resultadoTitulo.className =
          "resultadoTitulo rojo";

        resultadoTitulo.textContent =
          "🔴 YA UTILIZADA";


        resultadoInfo.innerHTML =
          "<strong>NO PERMITIR ACCESO</strong><br><br>" +
          "Folio: " +
          (datos.folio || "Sin folio") +
          "<br>" +
          "Nombre: " +
          (datos.nombre || "No registrado") +
          "<br><br>" +
          "Esta entrada ya fue registrada anteriormente.";

      }

      else if (
        datos.resultado ===
        "CANCELADO"
      ) {

        resultadoTitulo.className =
          "resultadoTitulo rojo";

        resultadoTitulo.textContent =
          "🚫 ENTRADA CANCELADA";


        resultadoInfo.innerHTML =
          datos.mensaje ||
          "Este boleto fue cancelado.";

      }

      else if (
        datos.resultado ===
        "CERRADA"
      ) {

        resultadoTitulo.className =
          "resultadoTitulo amarillo";

        resultadoTitulo.textContent =
          "🟡 ENTRADA AÚN NO ABIERTA";


        resultadoInfo.innerHTML =
          "Folio: " +
          (datos.folio || "Sin folio") +
          "<br>" +
          "Nombre: " +
          (datos.nombre || "No registrado") +
          "<br><br>" +
          (
            datos.mensaje ||
            "La entrada todavía no está abierta."
          );

      }

      else {

        resultadoTitulo.className =
          "resultadoTitulo rojo";

        resultadoTitulo.textContent =
          "❌ ENTRADA NO VÁLIDA";


        resultadoInfo.innerHTML =
          datos.mensaje ||
          "Boleto no encontrado.";

      }


      mensaje.textContent =
        "Resultado de la verificación.";


      botonCamara.disabled =
        true;


      botonCamara.textContent =
        "📷 Cámara detenida";

    }


    function mostrarError(
      texto
    ) {

      boletoEnProceso =
        false;


      resultado.style.display =
        "block";


      resultadoTitulo.className =
        "resultadoTitulo rojo";


      resultadoTitulo.textContent =
        "⚠️ ERROR";


      resultadoInfo.textContent =
        texto;


      mensaje.textContent =
        "Puedes intentar nuevamente.";

    }


    iniciar();

  </script>

</body>

</html>
