<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Control de acceso | Después de la muerte
  </title>

  <style>

    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: #fff;
      font-family:
        Arial,
        sans-serif;
      text-align: center;
    }

    .contenedor {
      max-width: 500px;
      margin: 40px auto;
    }

    .tarjeta {
      background: #1c1c1c;
      border-radius: 18px;
      padding: 25px;
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    p {
      color: #aaa;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      border: 0;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      background: #fff;
      color: #111;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    video {
      width: 100%;
      margin-top: 20px;
      border-radius: 15px;
      background: #000;
      display: none;
    }

    canvas {
      display: none;
    }

    #mensaje {
      margin-top: 20px;
      line-height: 1.5;
      color: #aaa;
    }

    .estado {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #111;
      color: #aaa;
    }

  </style>

</head>

<body>

  <div class="contenedor">

    <div class="tarjeta">

      <h1>
        🎟️ Control de acceso
      </h1>

      <p>
        Después de la muerte
      </p>

      <div
        id="estadoSesion"
        class="estado"
      >
        🔐 Verificando sesión...
      </div>

      <button
        id="botonCamara"
        type="button"
        disabled
      >
        📷 Abrir cámara
      </button>

      <video
        id="video"
        autoplay
        playsinline
        muted
      ></video>

      <canvas
        id="canvas"
      ></canvas>

      <div
        id="mensaje"
      >
        Preparando escáner...
      </div>

    </div>

  </div>

  <script>

    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycbyC7Z6SMYtjsQSHsCagLZLKQrSJ3ax_hlPHc-WUYuQy-7pt7CtC3s6ubrWqL9YEnQqjgg/exec";


    const video =
      document.getElementById(
        "video"
      );


    const canvas =
      document.getElementById(
        "canvas"
      );


    const mensaje =
      document.getElementById(
        "mensaje"
      );


    const estadoSesion =
      document.getElementById(
        "estadoSesion"
      );


    const botonCamara =
      document.getElementById(
        "botonCamara"
      );


    const contexto =
      canvas.getContext(
        "2d"
      );


    let token = "";

    let escaneando = false;

    let stream = null;

    let regresoDesdeResultado = false;


    function obtenerToken() {

      const parametros =
        new URLSearchParams(
          window.location.search
        );

      return (
        parametros.get("token") ||
        ""
      );

    }


    function iniciar() {

      token =
        obtenerToken();


      if (!token) {

        estadoSesion.style.color =
          "#ff7777";

        estadoSesion.textContent =
          "❌ Sesión no autorizada.";

        mensaje.textContent =
          "Regresa al inicio e ingresa nuevamente.";

        return;

      }


      estadoSesion.style.color =
        "#7CFF8A";

      estadoSesion.textContent =
        "✅ Sesión autorizada";


      botonCamara.disabled =
        false;


      mensaje.textContent =
        "Pulsa el botón para abrir la cámara.";


      /*
       * Detectamos si la página fue abierta
       * desde el botón "Escanear otro boleto".
       */
      if (
        document.referrer &&
        document.referrer.indexOf(
          "script.google.com"
        ) !== -1
      ) {

        regresoDesdeResultado =
          true;

      }

    }


    botonCamara.addEventListener(
      "click",
      iniciarCamara
    );


    async function iniciarCamara() {

      botonCamara.disabled =
        true;


      botonCamara.textContent =
        "⏳ Preparando cámara...";


      mensaje.textContent =
        "Preparando cámara...";


      /*
       * Si venimos desde "Escanear otro boleto",
       * esperamos un poco antes de pedir nuevamente
       * acceso al dispositivo.
       */
      if (
        regresoDesdeResultado
      ) {

        await esperar(
          1200
        );

      }


      mensaje.textContent =
        "Solicitando acceso a la cámara...";


      try {

        /*
         * Por seguridad, detenemos cualquier
         * stream que todavía pudiera existir.
         */
        detenerCamara();


        stream =
          await navigator.mediaDevices
            .getUserMedia({

              video: {
                facingMode:
                  "environment"
              },

              audio: false

            });


        video.srcObject =
          stream;


        video.style.display =
          "block";


        escaneando =
          true;


        regresoDesdeResultado =
          false;


        botonCamara.textContent =
          "📷 Cámara activa";


        mensaje.style.color =
          "#fff";


        mensaje.textContent =
          "Apunta la cámara al código QR.";


        cargarLectorQR();

      }

      catch(error) {

        botonCamara.disabled =
          false;


        botonCamara.textContent =
          "📷 Intentar de nuevo";


        mensaje.style.color =
          "#ff7777";


        mensaje.innerHTML =
          "❌ No se pudo abrir la cámara.<br><br>" +
          "<small>" +
          error.name +
          "<br>" +
          error.message +
          "</small>";


        console.error(
          "CAMARA:",
          error
        );

      }

    }


    function esperar(
      milisegundos
    ) {

      return new Promise(
        function(resolve) {

          setTimeout(
            resolve,
            milisegundos
          );

        }
      );

    }


    function detenerCamara() {

      escaneando =
        false;


      if (
        stream
      ) {

        stream
          .getTracks()
          .forEach(
            function(track) {

              try {

                track.stop();

              }

              catch(error) {

                console.error(
                  "ERROR AL DETENER TRACK:",
                  error
                );

              }

            }
          );

      }


      stream =
        null;


      video.srcObject =
        null;


      video.style.display =
        "none";

    }


    function cargarLectorQR() {

      if (
        window.jsQR
      ) {

        requestAnimationFrame(
          escanear
        );

        return;

      }


      const script =
        document.createElement(
          "script"
        );


      script.src =
        "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";


      script.onload =
        function() {

          requestAnimationFrame(
            escanear
          );

        };


      script.onerror =
        function() {

          escaneando =
            false;


          detenerCamara();


          mensaje.style.color =
            "#ff7777";


          mensaje.textContent =
            "❌ No se pudo cargar el lector QR.";

        };


      document.head.appendChild(
        script
      );

    }


    function escanear() {

      if (
        !escaneando
      ) {

        return;

      }


      if (
        video.readyState ===
        video.HAVE_ENOUGH_DATA
      ) {

        canvas.width =
          video.videoWidth;


        canvas.height =
          video.videoHeight;


        contexto.drawImage(
          video,
          0,
          0,
          canvas.width,
          canvas.height
        );


        const imagen =
          contexto.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
          );


        const codigoQR =
          jsQR(
            imagen.data,
            imagen.width,
            imagen.height
          );


        if (
          codigoQR &&
          codigoQR.data
        ) {

          procesarQR(
            codigoQR.data
          );

          return;

        }

      }


      requestAnimationFrame(
        escanear
      );

    }


    function procesarQR(
      textoQR
    ) {

      if (
        !escaneando
      ) {

        return;

      }


      escaneando =
        false;


      detenerCamara();


      mensaje.style.color =
        "#fff";


      mensaje.textContent =
        "🔎 Verificando boleto...";


      let codigo =
        textoQR.trim();


      try {

        const url =
          new URL(
            textoQR
          );


        const codigoURL =
          url.searchParams.get(
            "code"
          );


        if (
          codigoURL
        ) {

          codigo =
            codigoURL;

        }

      }

      catch(error) {

        /*
         * Si no es una URL,
         * usamos directamente
         * el texto del QR.
         */

      }


      if (
        !codigo
      ) {

        mensaje.style.color =
          "#ff7777";


        mensaje.textContent =
          "❌ No se encontró un código válido.";


        botonCamara.disabled =
          false;


        botonCamara.textContent =
          "📷 Abrir cámara";


        return;

      }


      const urlResultado =
        URL_APPS_SCRIPT +
        "?modo=resultadoEscaneo" +
        "&code=" +
        encodeURIComponent(
          codigo
        ) +
        "&token=" +
        encodeURIComponent(
          token
        );


      window.location.href =
        urlResultado;

    }


    iniciar();

  </script>

</body>

</html>
