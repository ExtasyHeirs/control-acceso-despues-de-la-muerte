<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Control de acceso | Después de la muerte
  </title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .contenedor {
      width: 100%;
      max-width: 420px;
      margin: 40px auto;
    }

    .titulo {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitulo {
      color: #aaa;
      margin-bottom: 25px;
    }

    .card {
      background: #1c1c1c;
      border-radius: 16px;
      padding: 22px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #fff;
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
    }

    #lectorQR {
      width: 100%;
      margin-top: 20px;
    }

    #resultado {
      margin-top: 16px;
      text-align: center;
      line-height: 1.5;
      color: #aaa;
    }

  </style>

</head>


<body>

  <div class="contenedor">

    <div class="titulo">
      🔐 Control de acceso
    </div>

    <div class="subtitulo">
      Después de la muerte
    </div>

    <div class="card">

      <button
        id="botonCamara"
        type="button"
      >
        📷 Abrir cámara
      </button>

      <div id="lectorQR"></div>

      <div id="resultado">
        Pulsa el botón para iniciar el escáner.
      </div>

    </div>

  </div>


  <script>

    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycbyC7Z6SMYtjsQSHsCagLZLKQrSJ3ax_hlPHc-WUYuQy-7pt7CtC3s6ubrWqL9YEnQqjgg/exec";


    const boton =
      document.getElementById(
        "botonCamara"
      );

    const lectorQR =
      document.getElementById(
        "lectorQR"
      );

    const resultado =
      document.getElementById(
        "resultado"
      );


    boton.addEventListener(
      "click",
      iniciarCamara
    );


    function cargarLectorQR() {

      return new Promise(
        function(resolve, reject) {

          if (
            typeof Html5Qrcode !==
            "undefined"
          ) {

            resolve();

            return;

          }

          const script =
            document.createElement(
              "script"
            );

          script.src =
            "https://unpkg.com/html5-qrcode";

          script.onload =
            resolve;

          script.onerror =
            reject;

          document.head.appendChild(
            script
          );

        }
      );

    }


    async function iniciarCamara() {

      boton.disabled = true;

      boton.textContent =
        "⏳ Preparando cámara...";

      resultado.textContent =
        "";


      try {

        await cargarLectorQR();


        const lector =
          new Html5Qrcode(
            "lectorQR"
          );


        await lector.start(

          {
            facingMode:
              "environment"
          },

          {
            fps: 10,

            qrbox: {
              width: 250,
              height: 250
            }

          },

          async function(textoQR) {

            await lector.stop();

            procesarQR(textoQR);

          },

          function() {

            // Errores normales
            // durante la búsqueda.

          }

        );


        boton.textContent =
          "📷 Cámara activa";

      }

      catch(error) {

        resultado.innerHTML =
          "❌ No se pudo abrir la cámara.<br><br>" +
          "<small>" +
          (
            error.message ||
            error
          ) +
          "</small>";

        boton.disabled =
          false;

        boton.textContent =
          "📷 Intentar de nuevo";

      }

    }


    function procesarQR(textoQR) {

      resultado.textContent =
        "⏳ Procesando boleto...";


      let codigo = "";


      try {

        const url =
          new URL(textoQR);

        codigo =
          url.searchParams.get(
            "code"
          );

      }

      catch(error) {

        resultado.textContent =
          "❌ El QR no contiene un boleto válido.";

        boton.disabled =
          false;

        boton.textContent =
          "📷 Escanear otro";

        return;

      }


      if (!codigo) {

        resultado.textContent =
          "❌ No se encontró el código del boleto.";

        boton.disabled =
          false;

        boton.textContent =
          "📷 Escanear otro";

        return;

      }


      resultado.innerHTML =
        "🔎 Código detectado:<br><strong>" +
        codigo +
        "</strong><br><br>" +
        "Consultando servidor...";


      /*
       * PRUEBA TEMPORAL
       *
       * Todavía no estamos consumiendo
       * el boleto porque no tenemos token.
       */

      const urlPrueba =
        URL_APPS_SCRIPT +
        "?modo=resultadoEscaneo" +
        "&code=" +
        encodeURIComponent(
          codigo
        );


      window.location.href =
        urlPrueba;

    }

  </script>

</body>

</html>
