<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Control de acceso
  </title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #111;

      color: #fff;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 20px;

    }

    .contenedor {

      width: 100%;

      max-width: 520px;

    }

    .tarjeta {

      background: #1b1b1b;

      border-radius: 18px;

      padding: 24px;

      box-shadow:
        0 10px 40px
        rgba(0,0,0,.45);

      text-align: center;

    }

    h1 {

      margin: 0 0 6px;

      font-size: 24px;

    }

    .subtitulo {

      color: #aaa;

      margin-bottom: 24px;

      font-size: 14px;

    }

    #estado {

      margin: 18px 0;

      padding: 14px;

      border-radius: 10px;

      background: #242424;

      color: #ddd;

      font-size: 14px;

      line-height: 1.5;

    }

    button {

      width: 100%;

      border: 0;

      border-radius: 12px;

      padding: 15px;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      background: #fff;

      color: #111;

      margin-top: 10px;

    }

    button:disabled {

      opacity: .5;

      cursor: not-allowed;

    }

    #visor {

      display: none;

      width: 100%;

      margin-top: 18px;

      border-radius: 14px;

      overflow: hidden;

      background: #000;

    }

    #video {

      display: block;

      width: 100%;

      height: auto;

    }

    #canvas {

      display: none;

    }

    .resultado {

      margin-top: 18px;

      padding: 18px;

      border-radius: 14px;

      background: #242424;

      line-height: 1.6;

    }

  </style>

</head>

<body>

  <div class="contenedor">

    <div class="tarjeta">

      <h1>
        🎟️ Control de acceso
      </h1>

      <div class="subtitulo">
        Después de la muerte
      </div>

      <div id="estado">

        📷 Preparando lector QR...

      </div>

      <button
        id="botonCamara"
        type="button"
      >

        📷 Abrir cámara

      </button>

      <div id="visor">

        <video
          id="video"
          autoplay
          playsinline
          muted
        ></video>

      </div>

      <canvas id="canvas"></canvas>

      <div
        id="resultado"
        class="resultado"
      >

        Apunta la cámara a un código QR.

      </div>

    </div>

  </div>


  <script>

    const estado =
      document.getElementById(
        "estado"
      );

    const botonCamara =
      document.getElementById(
        "botonCamara"
      );

    const visor =
      document.getElementById(
        "visor"
      );

    const video =
      document.getElementById(
        "video"
      );

    const canvas =
      document.getElementById(
        "canvas"
      );

    const resultado =
      document.getElementById(
        "resultado"
      );


    let stream = null;

    let escaneando = false;

    let jsQRDisponible = false;


    function cargarJSQR() {

      return new Promise(
        function(resolve, reject) {

          if (window.jsQR) {

            jsQRDisponible = true;

            resolve();

            return;

          }


          const script =
            document.createElement(
              "script"
            );

          script.src =
            "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";


          script.onload =
            function() {

              if (window.jsQR) {

                jsQRDisponible = true;

                resolve();

              } else {

                reject(
                  new Error(
                    "jsQR no está disponible."
                  )
                );

              }

            };


          script.onerror =
            function() {

              reject(
                new Error(
                  "No se pudo cargar el lector QR."
                )
              );

            };


          document.head.appendChild(
            script
          );

        }
      );

    }


    botonCamara.addEventListener(
      "click",
      async function() {

        botonCamara.disabled =
          true;

        estado.innerHTML =
          "📷 Solicitando acceso a la cámara...";


        try {

          if (
            !window.isSecureContext
          ) {

            throw new Error(
              "Esta página no está siendo considerada segura por el navegador."
            );

          }


          if (
            !navigator.mediaDevices
          ) {

            throw new Error(
              "navigator.mediaDevices no está disponible."
            );

          }


          if (
            !navigator.mediaDevices.getUserMedia
          ) {

            throw new Error(
              "getUserMedia no está disponible."
            );

          }


          /*
           * IMPORTANTE:
           * Primero abrimos la cámara directamente,
           * igual que en la prueba que funcionó.
           */

          stream =
            await navigator
              .mediaDevices
              .getUserMedia({

                video: {

                  facingMode: {

                    ideal:
                      "environment"

                  }

                },

                audio: false

              });


          video.srcObject =
            stream;


          await video.play();


          visor.style.display =
            "block";


          estado.innerHTML =
            "✅ Cámara funcionando.<br>" +
            "Apunta al código QR del boleto.";


          resultado.innerHTML =
            "🔎 Buscando código QR...";


          /*
           * Después de abrir la cámara,
           * cargamos el lector QR.
           */

          await cargarJSQR();


          escaneando =
            true;


          requestAnimationFrame(
            escanear
          );


        } catch (error) {

          console.error(
            error
          );


          estado.innerHTML =
            "❌ No se pudo abrir la cámara.";


          resultado.innerHTML =
            "<b>" +
            (error.name ||
              "Error") +
            "</b><br><br>" +
            (error.message ||
              "Sin detalles");


          botonCamara.disabled =
            false;

        }

      }

    );


    function escanear() {

      if (!escaneando) {

        return;

      }


      if (!jsQRDisponible) {

        requestAnimationFrame(
          escanear
        );

        return;

      }


      if (
        video.readyState <
        video.HAVE_ENOUGH_DATA
      ) {

        requestAnimationFrame(
          escanear
        );

        return;

      }


      const ancho =
        video.videoWidth;

      const alto =
        video.videoHeight;


      if (
        !ancho ||
        !alto
      ) {

        requestAnimationFrame(
          escanear
        );

        return;

      }


      canvas.width =
        ancho;

      canvas.height =
        alto;


      const contexto =
        canvas.getContext(
          "2d",
          {
            willReadFrequently:
              true
          }
        );


      contexto.drawImage(
        video,
        0,
        0,
        ancho,
        alto
      );


      const imagen =
        contexto.getImageData(
          0,
          0,
          ancho,
          alto
        );


      const codigoQR =
        window.jsQR(
          imagen.data,
          imagen.width,
          imagen.height,
          {
            inversionAttempts:
              "attemptBoth"
          }
        );


      if (
        codigoQR &&
        codigoQR.data
      ) {

        escaneando =
          false;


        detenerCamara();


        mostrarQR(
          codigoQR.data
        );


        return;

      }


      requestAnimationFrame(
        escanear
      );

    }


    function mostrarQR(
      contenido
    ) {

      resultado.innerHTML =
        "<b>✅ QR DETECTADO</b><br><br>" +
        "<strong>Contenido leído:</strong><br><br>" +
        escaparHTML(
          contenido
        );


      estado.innerHTML =
        "🎟️ Código QR leído correctamente.";

    }


    function detenerCamara() {

      if (stream) {

        stream
          .getTracks()
          .forEach(
            function(track) {

              track.stop();

            }
          );

        stream =
          null;

      }


      video.srcObject =
        null;

    }


    function escaparHTML(
      texto
    ) {

      return String(
        texto || ""
      )

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }

  </script>

</body>

</html>
