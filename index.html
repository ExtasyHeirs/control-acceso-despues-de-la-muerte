<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Diagnóstico de cámara
  </title>

  <style>

    body {

      margin: 0;
      padding: 20px;

      min-height: 100vh;

      box-sizing: border-box;

      background: #111;

      color: #fff;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      text-align: center;

    }

    .contenedor {

      width: 100%;
      max-width: 500px;

      margin: 40px auto;

    }

    .tarjeta {

      background: #1c1c1c;

      border-radius: 18px;

      padding: 25px;

      box-sizing: border-box;

    }

    h1 {

      margin-top: 0;

      font-size: 27px;

    }

    p {

      color: #aaa;

      line-height: 1.5;

    }

    button {

      width: 100%;

      padding: 16px;

      margin-top: 20px;

      border: 0;

      border-radius: 12px;

      background: #fff;

      color: #111;

      font-size: 17px;

      font-weight: bold;

    }

    button:disabled {

      opacity: .5;

    }

    video {

      display: none;

      width: 100%;

      margin-top: 20px;

      border-radius: 15px;

      background: #000;

    }

    .estado {

      margin-top: 20px;

      padding: 15px;

      border-radius: 12px;

      background: #111;

      color: #aaa;

      line-height: 1.5;

      word-break: break-word;

    }

    .verde {

      color: #7CFF8A;

    }

    .rojo {

      color: #ff7777;

    }

  </style>

</head>


<body>

  <div class="contenedor">

    <div class="tarjeta">

      <h1>
        📷 Diagnóstico de cámara
      </h1>

      <p>
        Después de la muerte
      </p>


      <div
        id="estado"
        class="estado"
      >
        Preparando diagnóstico...
      </div>


      <button
        id="boton"
        type="button"
      >
        📷 Probar cámara
      </button>


      <video
        id="video"
        autoplay
        playsinline
        muted
      ></video>

    </div>

  </div>


  <script>

    const estado =
      document.getElementById(
        "estado"
      );


    const boton =
      document.getElementById(
        "boton"
      );


    const video =
      document.getElementById(
        "video"
      );


    /*
      =====================================================
      INFORMACIÓN DEL NAVEGADOR
      =====================================================
    */

    function diagnosticoInicial() {

      const secure =
        window.isSecureContext;


      const media =
        !!(
          navigator.mediaDevices
        );


      estado.innerHTML =

        "🔎 Diagnóstico listo.<br><br>" +

        "HTTPS: " +

        (
          secure
            ? "✅ Sí"
            : "❌ No"
        ) +

        "<br>" +

        "mediaDevices: " +

        (
          media
            ? "✅ Disponible"
            : "❌ No disponible"
        ) +

        "<br><br>" +

        "Pulsa <strong>Probar cámara</strong>.";

    }


    /*
      =====================================================
      PROBAR CÁMARA
      =====================================================
    */

    async function probarCamara() {

      boton.disabled =
        true;


      boton.textContent =
        "⏳ Solicitando cámara...";


      estado.className =
        "estado";


      estado.innerHTML =
        "📷 Solicitando permiso de cámara...";


      try {

        /*
          Comprobación 1
        */

        if (
          !window.isSecureContext
        ) {

          throw new Error(
            "La página no está ejecutándose en un contexto HTTPS seguro."
          );

        }


        /*
          Comprobación 2
        */

        if (
          !navigator.mediaDevices
        ) {

          throw new Error(
            "navigator.mediaDevices no está disponible en este navegador."
          );

        }


        /*
          Comprobación 3
        */

        if (
          !navigator.mediaDevices.getUserMedia
        ) {

          throw new Error(
            "getUserMedia no está disponible en este navegador."
          );

        }


        /*
          AQUÍ DEBE APARECER EL AVISO
          NATIVO DE LA CÁMARA.
        */

        const stream =
          await navigator
            .mediaDevices
            .getUserMedia({

              video: true,

              audio: false

            });


        /*
          Si llegamos aquí,
          la cámara funcionó.
        */

        video.srcObject =
          stream;


        video.style.display =
          "block";


        estado.className =
          "estado verde";


        estado.innerHTML =

          "🟢 CÁMARA FUNCIONANDO<br><br>" +

          "El navegador permitió correctamente " +

          "el acceso a la cámara.<br><br>" +

          "Ya podemos volver a montar el escáner.";

        
        boton.textContent =
          "✅ Cámara funcionando";


      }

      catch(error) {

        console.error(
          "DIAGNÓSTICO DE CÁMARA:",
          error
        );


        estado.className =
          "estado rojo";


        estado.innerHTML =

          "🔴 FALLÓ LA CÁMARA<br><br>" +

          "<strong>Nombre:</strong><br>" +

          (
            error.name ||
            "Desconocido"
          ) +

          "<br><br>" +

          "<strong>Mensaje:</strong><br>" +

          (
            error.message ||
            "Sin mensaje"
          );


        boton.disabled =
          false;


        boton.textContent =
          "📷 Probar cámara otra vez";

      }

    }


    boton.addEventListener(
      "click",
      probarCamara
    );


    diagnosticoInicial();

  </script>

</body>

</html>
