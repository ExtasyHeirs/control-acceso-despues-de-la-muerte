<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Control de acceso</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .contenedor {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    .tarjeta {
      background: #1c1c1c;
      border-radius: 18px;
      padding: 28px 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,.35);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .subtitulo {
      color: #aaa;
      margin-bottom: 25px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px;
      margin-top: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #botonCamara {
      background: white;
      color: black;
    }

    #botonOtro {
      background: #333;
      color: white;
    }

    #video {
      width: 100%;
      max-height: 65vh;
      object-fit: cover;
      border-radius: 14px;
      margin-top: 18px;
      display: none;
      background: black;
    }

    #canvas {
      display: none;
    }

    #estado {
      margin-top: 18px;
      line-height: 1.5;
    }

    .exito {
      color: #5cff8d;
    }

    .error {
      color: #ff6b6b;
    }

    .espera {
      color: #ffd166;
    }

    .resultado {
      margin-top: 20px;
      padding: 18px;
      border-radius: 14px;
      background: #292929;
      line-height: 1.6;
    }

  </style>

</head>

<body>

<div class="contenedor">

  <div class="tarjeta">

    <h1>🎟️ Control de acceso</h1>

    <div class="subtitulo">
      Después de la muerte
    </div>

    <div id="estado">
      🔐 Comprobando sesión...
    </div>

    <button
      id="botonCamara"
      style="display:none;"
    >
      📷 Abrir cámara
    </button>

    <video
      id="video"
      autoplay
      playsinline
      muted
    ></video>

    <canvas id="canvas"></canvas>

    <div
      id="resultado"
      class="resultado"
      style="display:none;"
    ></div>

    <button
      id="botonOtro"
      style="display:none;"
    >
      🔄 Escanear otro boleto
    </button>

  </div>

</div>

<script>

const URL_APPS_SCRIPT =
  "https://script.google.com/macros/s/AKfycbyC7Z6SMYtjsQSHsCagLZLKQrSJ3ax_hlPHc-WUYuQy-7pt7CtC3s6ubrWqL9YEnQqjgg/exec";


const estado =
  document.getElementById("estado");

const botonCamara =
  document.getElementById("botonCamara");

const botonOtro =
  document.getElementById("botonOtro");

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const resultadoBox =
  document.getElementById("resultado");


let token = "";

let stream = null;

let escaneando = false;

let jsQRDisponible = false;


/*
========================================
OBTENER TOKEN
========================================
*/

const parametros =
  new URLSearchParams(
    window.location.search
  );

token =
  parametros.get("token") || "";


/*
========================================
SESION
========================================
*/

if (!token) {

  estado.innerHTML =
    "❌ Sesión no autorizada.<br><br>" +
    "Regresa al inicio e ingresa nuevamente.";

} else {

  estado.innerHTML =
    "✅ Sesión autorizada";

  botonCamara.style.display =
    "block";

}


/*
========================================
CARGAR JSQR
========================================
*/

function cargarJsQR() {

  return new Promise(
    function(resolve, reject) {

      if (
        typeof jsQR ===
        "function"
      ) {

        jsQRDisponible = true;

        resolve();

        return;
      }

      const script =
        document.createElement(
          "script"
        );

      script.src =
        "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";

      script.onload =
        function() {

          if (
            typeof jsQR ===
            "function"
          ) {

            jsQRDisponible = true;

            resolve();

          } else {

            reject(
              new Error(
                "jsQR no pudo cargarse."
              )
            );

          }

        };

      script.onerror =
        function() {

          reject(
            new Error(
              "No se pudo cargar jsQR."
            )
          );

        };

      document.head.appendChild(
        script
      );

    }
  );

}


/*
========================================
ABRIR CAMARA
========================================
*/

botonCamara.onclick =
  async function() {

    botonCamara.disabled =
      true;

    estado.innerHTML =
      "📷 Solicitando acceso a la cámara...";

    try {

      /*
       * IMPORTANTE:
       * Primero usamos la solicitud
       * más sencilla posible.
       */

      stream =
        await navigator.mediaDevices
          .getUserMedia({

            video: true,

            audio: false

          });


      /*
       * La cámara YA fue autorizada.
       * Ahora cargamos jsQR.
       */

      estado.innerHTML =
        "📷 Cámara autorizada.<br>" +
        "Cargando lector QR...";


      video.srcObject =
        stream;

      video.style.display =
        "block";


      await video.play();


      await cargarJsQR();


      estado.innerHTML =
        "📷 Cámara activa.<br>" +
        "Apunta al código QR.";


      escaneando =
        true;

      botonCamara.style.display =
        "none";


      escanear();


    } catch (error) {

      console.error(
        error
      );

      estado.innerHTML =
        "❌ No se pudo abrir la cámara." +
        "<br><br>" +
        "<strong>" +
        error.name +
        "</strong>" +
        "<br>" +
        (error.message || "") +
        "<br><br>" +
        "Permite el acceso a la cámara para este sitio.";

      botonCamara.disabled =
        false;

    }

  };


/*
========================================
ESCANEAR
========================================
*/

function escanear() {

  if (
    !escaneando ||
    !jsQRDisponible
  ) {

    return;

  }


  if (
    video.readyState <
    video.HAVE_ENOUGH_DATA
  ) {

    requestAnimationFrame(
      escanear
    );

    return;

  }


  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  const imagen =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );


  const codigoQR =
    jsQR(
      imagen.data,
      imagen.width,
      imagen.height
    );


  if (codigoQR) {

    escaneando =
      false;

    detenerCamara();

    procesarQR(
      codigoQR.data
    );

    return;

  }


  requestAnimationFrame(
    escanear
  );

}


/*
========================================
PROCESAR QR
========================================
*/

function procesarQR(
  contenido
) {

  let codigo =
    "";


  const coincidencia =
    contenido.match(
      /DM-\d{4,}/i
    );


  if (coincidencia) {

    codigo =
      coincidencia[0]
        .toUpperCase();

  }


  if (!codigo) {

    const url =
      new URL(
        contenido
      );

    codigo =
      url.searchParams.get(
        "code"
      ) || "";

  }


  if (!codigo) {

    mostrarResultado(
      "❌ QR no reconocido.",
      "error"
    );

    botonOtro.style.display =
      "block";

    return;

  }


  estado.innerHTML =
    "🔄 Validando boleto...";


  resultadoBox.style.display =
    "none";


  const iframe =
    document.createElement(
      "iframe"
    );


  iframe.style.display =
    "none";


  iframe.src =
    URL_APPS_SCRIPT +
    "?modo=resultadoEscaneo" +
    "&code=" +
    encodeURIComponent(
      codigo
    ) +
    "&token=" +
    encodeURIComponent(
      token
    );


  document.body.appendChild(
    iframe
  );


  window.addEventListener(
    "message",
    recibirResultado
  );


  setTimeout(
    function() {

      mostrarResultado(
        "⚠️ Error de comunicación<br><br>" +
        "Apps Script no respondió a tiempo.",
        "error"
      );

      botonOtro.style.display =
        "block";

    },
    10000
  );

}


/*
========================================
RECIBIR RESULTADO
========================================
*/

function recibirResultado(
  event
) {

  if (
    event.origin !==
      "https://script.google.com" &&
    event.origin !==
      "https://script.googleusercontent.com"
  ) {

    return;

  }


  const datos =
    event.data;


  if (
    !datos ||
    datos.tipo !==
      "RESULTADO_BOLETO"
  ) {

    return;

  }


  const r =
    datos.resultado || {};


  let html =
    "";


  if (
    r.resultado ===
    "VALIDO"
  ) {

    html =
      "🟢 <strong>ENTRADA VÁLIDA</strong><br><br>" +
      "Acceso autorizado<br><br>" +
      "Folio: " +
      (r.folio || "Sin folio") +
      "<br>" +
      "Nombre: " +
      (r.nombre || "No registrado");


    mostrarResultado(
      html,
      "exito"
    );


  } else if (
    r.resultado ===
      "USADO"
  ) {

    html =
      "🔴 <strong>YA UTILIZADA</strong><br><br>" +
      "Este boleto ya fue utilizado.";


    mostrarResultado(
      html,
      "error"
    );


  } else if (
    r.resultado ===
      "CANCELADO"
  ) {

    html =
      "🚫 <strong>ENTRADA CANCELADA</strong><br><br>" +
      "Este boleto fue cancelado.";


    mostrarResultado(
      html,
      "error"
    );


  } else if (
    r.resultado ===
      "PENDIENTE" ||
    r.resultado ===
      "CERRADA"
  ) {

    html =
      "🟡 <strong>ENTRADA AÚN NO ABIERTA</strong><br><br>" +
      "El acceso todavía no está abierto.";


    mostrarResultado(
      html,
      "espera"
    );


  } else {

    html =
      "❌ <strong>NO VÁLIDO</strong><br><br>" +
      (
        r.mensaje ||
        "No se pudo validar el boleto."
      );


    mostrarResultado(
      html,
      "error"
    );

  }


  botonOtro.style.display =
    "block";

}


/*
========================================
MOSTRAR RESULTADO
========================================
*/

function mostrarResultado(
  html,
  clase
) {

  resultadoBox.innerHTML =
    html;

  resultadoBox.className =
    "resultado " +
    clase;

  resultadoBox.style.display =
    "block";

}


/*
========================================
DETENER CAMARA
========================================
*/

function detenerCamara() {

  escaneando =
    false;


  if (stream) {

    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );

    stream =
      null;

  }


  video.srcObject =
    null;

}


/*
========================================
ESCANEAR OTRO
========================================
*/

botonOtro.onclick =
  function() {

    location.reload();

  };

</script>

</body>
</html>
